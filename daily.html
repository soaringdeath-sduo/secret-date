<head>

<title>28.10 — Наш маленький сериал</title>
<link rel="stylesheet" href="polaroid-theme.css?v=2">
<style>
:root{--paper:#fffaf4;--ink:#622f46;--rose:#a64f71;--muted:#8b6577;--edge:#e2babc}
*{box-sizing:border-box}html{min-height:100%;background:#f7ede6}body{min-height:100dvh;margin:0;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.daily-shell{width:min(100% - 24px,540px);margin:0 auto;padding:24px 0 55px}
.daily-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:22px}
.daily-top a{font-size:12px;color:#95516d;text-decoration:none;font-weight:700}
.daily-brand{letter-spacing:2px;font-size:11px;font-weight:800;color:#95516d}
.paper{position:relative;border:1px solid #ddbac1;border-radius:17px;background:linear-gradient(150deg,#fffefa,#fff1eb 70%,#fcf6eb);box-shadow:0 14px 35px #87526726;padding:25px 20px;overflow:hidden}
.paper:before{content:"";position:absolute;right:-15px;top:-8px;width:90px;height:26px;background:#d4a9ab77;transform:rotate(26deg);pointer-events:none}
.kicker{font-weight:850;letter-spacing:2.4px;font-size:11px;color:#af6480;text-transform:uppercase}
h1{font:normal clamp(36px,10vw,52px)/1.09 Georgia,serif;letter-spacing:-1px;margin:11px 0;color:#6a2e47}
h2{font:normal 32px/1.15 Georgia,serif;color:#6a2e47;margin:5px 0 12px}
h3{font-size:17px;color:#743b52;margin:7px 0}
p{line-height:1.65;color:#795d6d}
.subtitle{font-size:14px;line-height:1.65;margin:12px 0 15px}
.day-count{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;margin:19px 0}
.day-badge{background:#f8e3e8;color:#884c68;border:1px solid #e4bbc7;font-size:12px;border-radius:99px;padding:8px 12px;font-weight:750}
.daily-grid{display:grid;gap:11px;margin:20px 0}
.day-card{display:grid;grid-template-columns:46px 1fr auto;gap:11px;align-items:center;width:100%;border:1px solid #e3c5c7;border-radius:13px;padding:13px;text-align:left;background:#fff9f4;color:#663c50;font:inherit;cursor:pointer;box-shadow:0 4px 10px #b585900b}
.day-card:not([disabled]):hover{border-color:#c27896;transform:translateY(-1px)}
.day-card:disabled{opacity:.63;cursor:not-allowed;background:#f6f0e9}
.day-icon{font-size:30px;display:grid;place-items:center;width:45px;height:53px;background:#f6e1e6;border:4px solid white;box-shadow:0 4px 7px #9c597130;transform:rotate(-3deg)}
.day-card:nth-child(even) .day-icon{transform:rotate(3deg)}
.day-card strong{display:block;color:#723b51;font-size:14px;margin-bottom:3px}
.day-card small{display:block;color:#927184;font-size:11px;line-height:1.4}
.day-card .day-status{font-size:11px;font-weight:800;color:#9f5877;min-width:58px;text-align:right}
.quiz{background:#fffbf6;border:1px solid #eed1cf;border-radius:13px;padding:18px 15px;margin:18px 0}
.question-step{font-size:11px;letter-spacing:1.5px;font-weight:800;color:#a45a77;margin:0 0 8px}
.question{font-size:19px;font-weight:750;line-height:1.37;color:#6c344d;margin:0 0 16px}
.choices{display:grid;gap:10px}
.choice,.btn{width:100%;min-height:50px;padding:13px 15px;border-radius:12px;cursor:pointer;font:inherit;font-weight:750;font-size:14px}
.choice{background:#fff6f1;border:1px solid #dbaeba;color:#79435b}
.choice:hover,.choice:focus-visible{background:#f8e4e9;border-color:#b76685}
.btn{border:0;color:#fff9f6;background:linear-gradient(130deg,#b15276,#8d3f60);box-shadow:0 7px 15px #b372863d;margin:10px 0}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.alt{border:1px solid #dbb4c3;background:#fff9f6;color:#955573;box-shadow:none}
.btn.narrow{width:auto;padding:12px 20px}
.feedback{margin:14px 0 3px;color:#985474;font-size:13px;font-weight:700;min-height:20px}
.cross-word{display:flex;gap:4px;margin:13px 0}
.cross-word span{min-width:28px;height:35px;display:grid;place-items:center;border-radius:5px;background:#f4d9df;border:1px solid #d6a4b5;font-family:Georgia,serif;font-size:18px;color:#7c3d58}
.pill-group{display:flex;flex-wrap:wrap;gap:7px;margin:13px 0}
.pill{font-size:11px;border:1px solid #e0b4c1;border-radius:30px;color:#8e536b;padding:6px 10px;background:#fae8e9}
.story-polaroid{width:min(240px,85%);padding:11px 11px 33px;background:#fffefb;box-shadow:0 9px 24px #95616e3b;transform:rotate(3deg);margin:17px auto 22px}
.story-polaroid .view{background:radial-gradient(circle at 70% 24%,#f9d4bc 0 7%,transparent 25%),linear-gradient(138deg,#d6a1ac,#a67e9d 65%,#806980);height:145px;display:grid;place-items:center;font-size:52px;color:white}
.story-polaroid .caption{font:italic 16px Georgia,serif;text-align:center;margin-top:10px;color:#94546e}
.stamp{display:inline-block;border:2px dashed #bd6887;padding:7px 11px;border-radius:6px;font-weight:900;font-size:12px;color:#ad5978;transform:rotate(-3deg);margin-top:9px;background:#fff8f0}
.footer{font-size:12px;color:#906d7e;text-align:center;margin:22px 0}
.locked{background:#f9eeee;border:1px dashed #e0b8c3;border-radius:13px;padding:15px;font-size:13px;margin:15px 0;color:#895d70}
.skip-note{font-size:12px;color:#917283;margin-top:12px}
@media(max-width:370px){.daily-grid .day-card{grid-template-columns:35px 1fr auto;gap:7px;padding:11px 8px}.day-icon{width:35px;font-size:24px}.day-card .day-status{min-width:45px;font-size:10px}.paper{padding:22px 14px}}
@media(prefers-reduced-motion:reduce){.day-card{transition:none}}
</style>
</head>
<body class="polaroid-site">
<div class="daily-shell">
 <div class="daily-top"><div class="daily-brand">♥ ОПЕРАЦИЯ 28.10</div><a href="index.html">← К приглашению</a></div>
 <main id="daily-root" class="paper" aria-live="polite"></main>
 <div class="footer">Для Лизы, с любовью и капелькой хитрости ♡</div>
</div>
<script>
'use strict';
const DATE_KEY='sd2810-selected-day-v1',INVITE_KEY='sd2810-invite-approved-v3';
const HOST_KEY='sd2810-host-v3',BASE='sd2810-daily-v1';
const DATE_STARTS=[9,10,11,12,13,14];
const TITLES=['Досье подозреваемого','Мини-кросс','Правда или выдумка','Настроение свидания','Финальный допуск','Бонус: последний секрет'];
const ICONS=['🕵️','✏️','🎞️','💗','🎟️','💌'];
const DESC=['Три вопроса про Игоря','Три слова — всё просто','Три смешных утверждения','Выбери атмосферу','Одна кнопка — и готово','Маленькая открытка на завтра'];
const SHORT_DATES=['9 ноября','10 ноября','11 ноября','12 ноября','13 ноября','14 ноября'];
const QUIZZES=[
 [{q:'Кто организует секретное приключение?',choices:['Игорь','Кот в сапогах','Случайный водитель'],response:'Верно, главный подозреваемый — Игорь! 🕵️'},
  {q:'Какое у нашего организатора главное увлечение?',choices:['Техника и машины','Выращивание кактусов на Луне'],response:'Официально: техника. Неофициально: придумывать сюрпризы. 🚗'},
  {q:'Что в этой операции самое важное?',choices:['Провести время вместе','Разгадать всё за 20 секунд'],response:'Именно! Никакой спешки, только приятные моменты. ❤️'}],
 [{q:'Угадай слово: как зовут главную героиню?',choices:['ЛИЗА','ИГОРЬ'],response:'Главная героиня найдена!'},
  {q:'А организатора?',choices:['ИГОРЬ','ЛИЗА'],response:'Дело раскрыто!'},
  {q:'Что делает свидание особенным?',choices:['СМЕХ','ПЛАН'],response:'Смех и хорошие воспоминания важнее идеального плана. 💗'}],
 [{q:'Организатор обещает быть загадочным.',choices:['Правда','Выдумка'],response:'Подозрительная правда! 🕶️'},
  {q:'Чтобы хорошо провести время, обязательно всё разгадать заранее.',choices:['Правда','Выдумка'],response:'Нет, пусть некоторые сюрпризы останутся сюрпризами. 😉'},
  {q:'Главная цель операции — увидеть твою улыбку.',choices:['Правда','Выдумка'],response:'Совершенно секретно, но это правда. ❤️'}],
 [{q:'Какая атмосфера тебе ближе?',choices:['Уют и разговоры 🫖','Прогулка и приключения 🌷','Немного всего ✨'],response:'Отличный выбор!'},
  {q:'Что больше поднимет настроение?',choices:['Тёплые слова 💌','Смешной сюрприз 😄','Всё сразу ❤️'],response:'Отлично, записано в секретное досье.'},
  {q:'Какая музыка подойдёт вашему дню?',choices:['Что-то романтичное','Что-то весёлое','Плейлист от Игоря'],response:'Музыкальные разведданные получены! 🎵'}],
 [{q:'Перед тобой официальное разрешение на секретное свидание. Готова?',choices:['Готова! ❤️','Очень готова! ✨'],response:'Участница прошла подготовку. Добро пожаловать!'}],
 [{q:'Какую маленькую вещь возьмёшь с собой?',choices:['Хорошее настроение ❤️','Улыбку 😄','Любопытство ✨'],response:'Операция ждёт своего часа. Ты готова!'}]
];
const root=document.getElementById('daily-root');
let current=-1,sessionStep=0,sessionAnswers=[],doneMessage='';
const chosen=()=>localStorage.getItem(DATE_KEY);
const key=()=>BASE;
const isHost=()=>localStorage.getItem(HOST_KEY)==='1';
const count=()=>chosen()==='sun'?6:5;
function state(){
 try{const v=JSON.parse(localStorage.getItem(key())||'null');if(v&&v.done&&typeof v.done==='object'&&v.answers&&typeof v.answers==='object')return v;}catch(e){}
 return {done:{},answers:{}};
}
function persist(v){try{localStorage.setItem(key(),JSON.stringify(v))}catch(e){const msg=document.getElementById('save-warning');if(msg)msg.textContent='Не удалось сохранить прогресс — проверь свободное место браузера.'}}
function isUnlocked(i){return isHost()||Date.now()>=Date.UTC(2026,10,DATE_STARTS[i],6,0,0)}
function available(i){return i>=0&&i<count()&&isUnlocked(i)}
function completed(){const st=state();return Object.keys(st.done).filter(i=>+i<count()&&st.done[i]).length}
function e(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function ribbon(t){return '<div class="scrap-ribbon">'+e(t)+'</div>'}
function header(){
 return '<div class="kicker">МАЛЕНЬКИЙ СЕРИАЛ ДО СВИДАНИЯ</div><h1>Каждый день —<br><em>маленькая тайна ♡</em></h1>'
 +'<p class="subtitle">Лиза, у нашей операции появились короткие выпуски. Один день — одна забавная игра на минутку. Ошибаться можно, пропускать дни тоже!</p>'
 +'<div class="story-polaroid" aria-hidden="true"><div class="view">♡ ✨</div><div class="caption">Наши маленькие секреты</div></div>';
}
function renderHome(){
 current=-1;
 if(localStorage.getItem(INVITE_KEY)!=='1'||!['sat','sun'].includes(chosen())){
  root.innerHTML=header()+'<div class="locked">🔒 Сначала открой приглашение, введи ваш пароль и выбери дату свидания.</div>'
   +'<a class="btn" href="index.html" style="display:block;text-align:center;text-decoration:none">Перейти к приглашению 💌</a>';return;
 }
 const st=state(),n=count();
 let html=header()+'<div class="day-count"><span class="day-badge">🎟️ Выпусков: '+n+'</span><span class="day-badge">💗 Печатей: '+completed()+' / '+n+'</span></div><div class="daily-grid">';
 for(let i=0;i<n;i++){
  const locked=!isUnlocked(i),finished=!!st.done[i],when=SHORT_DATES[i];
  html+='<button type="button" class="day-card" data-open="'+i+'"'+(locked?' disabled':'')+'>'
   +'<span class="day-icon">'+ICONS[i]+'</span><span><strong>'+when+' · '+TITLES[i]+'</strong>'
   +'<small>'+(locked?'Откроется 9:00 по Москве':DESC[i])+'</small></span>'
   +'<span class="day-status">'+(finished?'✓ Готово':locked?'🔒':'Открыть')+'</span></button>';
 }
 html+='</div><p class="skip-note">Все открытые выпуски доступны повторно. Награды появятся в финальном отчёте.</p>'
  +'<a href="index.html" class="btn alt" style="display:block;text-align:center;text-decoration:none">Вернуться к приглашению ♡</a>';
 root.innerHTML=html;
 root.querySelectorAll('[data-open]').forEach(btn=>btn.addEventListener('click',()=>openDay(Number(btn.dataset.open))));
}
function openDay(i){
 if(!available(i))return;
 current=i;sessionStep=0;sessionAnswers=[];
 renderDay();
}
function renderDay(){
 if(current<0||!available(current)){renderHome();return;}
 const i=current,st=state(),finished=!!st.done[i],questions=QUIZZES[i];
 if(sessionStep>=questions.length){
  let html='<div class="kicker">ВЫПУСК '+(i+1)+' ЗАВЕРШЁН</div><h1>Миссия<br><em>пройдена! ♡</em></h1>'
   +'<div class="story-polaroid" aria-hidden="true"><div class="view">'+ICONS[i]+'</div><div class="caption">'+e(TITLES[i])+'</div></div>'
   +'<p>Ты заработала ещё одну печать в досье. Отличная работа, агент Л-01!</p>'
   +'<div class="stamp">✓ ВЫПУСК ВЫПОЛНЕН</div>'
   +'<p id="save-warning" class="skip-note"></p>'
   +'<button type="button" class="btn" id="back-home">К списку выпусков →</button>';
  root.innerHTML=html;
  const saved=state();saved.done[i]=true;saved.answers[i]=sessionAnswers.slice();persist(saved);
  root.querySelector('#back-home').addEventListener('click',renderHome);return;
 }
 const q=questions[sessionStep];
 let html='<div class="kicker">'+SHORT_DATES[i]+' · ВЫПУСК '+(i+1)+'</div>'
  +ribbon(TITLES[i])
  +'<div class="pill-group"><span class="pill">♥ Без сложных заданий</span><span class="pill">⏱️ 1 минута</span></div>'
  +(finished?'<div class="stamp">✓ Уже получена печать — можно поиграть ещё!</div>':'')
  +'<div class="quiz"><p class="question-step">ВОПРОС '+(sessionStep+1)+' / '+questions.length+'</p>'
  +'<p class="question">'+e(q.q)+'</p>';
 if(i===1)html+='<div class="cross-word">'+String(q.choices[0]).split('').map(()=>'<span>♡</span>').join('')+'</div>';
 html+='<div class="choices">'+q.choices.map((c,n)=>'<button type="button" class="choice" data-answer="'+n+'">'+e(c)+'</button>').join('')+'</div>'
  +'<p class="feedback" id="daily-feedback" role="status"></p></div>'
  +'<button type="button" class="btn alt" id="back-home">← Ко всем выпускам</button>';
 root.innerHTML=html;
 root.querySelector('#back-home').addEventListener('click',renderHome);
 root.querySelectorAll('[data-answer]').forEach(btn=>btn.addEventListener('click',()=>answer(Number(btn.dataset.answer))));
}
function answer(choice){
 if(current<0)return;
 const q=QUIZZES[current]?.[sessionStep];if(!q||!q.choices[choice])return;
 const feedback=document.getElementById('daily-feedback');
 sessionAnswers.push(choice);
 if(current===1){const slots=root.querySelectorAll('.cross-word span');q.choices[0].split('').forEach((ch,i)=>{if(slots[i])slots[i].textContent=ch})}
 if(feedback)feedback.textContent=q.response;
 root.querySelectorAll('[data-answer]').forEach(b=>b.disabled=true);
 const next=document.createElement('button');next.type='button';next.className='btn';next.textContent=sessionStep===QUIZZES[current].length-1?'Получить печать ♡':'Дальше →';next.addEventListener('click',()=>{sessionStep++;renderDay()});
 root.querySelector('.quiz')?.appendChild(next);
}
renderHome();
</script>
</body></html>
