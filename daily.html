<style>
:root{--paper:#fffaf4;--ink:#622f46;--rose:#a64f71;--muted:#8b6577;--edge:#e2babc}
*{box-sizing:border-box}html{min-height:100%;background:#f7ede6}body{min-height:100dvh;margin:0;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}

.day-count{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;margin:19px 0}
.day-badge{background:#f8e3e8;color:#884c68;border:1px solid #e4bbc7;font-size:12px;border-radius:99px;padding:8px 12px;font-weight:750}
.daily-grid{display:grid;gap:11px;margin:20px 0}
.day-card{display:grid;grid-template-columns:46px 1fr auto;gap:11px;align-items:center;width:100%;border:1px solid #e3c5c7;border-radius:13px;padding:13px;text-align:left;background:#fff9f4;color:#663c50;font:inherit;cursor:pointer;box-shadow:0 4px 10px #b585900b}
.day-card:not([disabled]):hover{border-color:#c27896;transform:translateY(-1px)}
.day-card:disabled{opacity:.63;cursor:not-allowed;background:#f6f0e9}
.day-icon{font-size:30px;display:grid;place-items:center;width:45px;height:53px;background:#f6e1e6;border:4px solid white;box-shadow:0 4px 7px #9c597130;transform:rotate(-3deg)}
.day-card:nth-child(even) .day-icon{transform:rotate(3deg)}
.day-card strong{display:block;color:#723b51;font-size:14px;margin-bottom:3px}
.day-card small{display:block;color:#927184;font-size:11px;line-height:1.4}
.day-card .day-status{font-size:11px;font-weight:800;color:#9f5877;min-width:58px;text-align:right}
.quiz{background:#fffbf6;border:1px solid #eed1cf;border-radius:13px;padding:18px 15px;margin:18px 0}
.question-step{font-size:11px;letter-spacing:1.5px;font-weight:800;color:#a45a77;margin:0 0 8px}
.question{font-size:19px;font-weight:750;line-height:1.37;color:#6c344d;margin:0 0 16px}
.choices{display:grid;gap:10px}
.choice,.btn{width:100%;min-height:50px;padding:13px 15px;border-radius:12px;cursor:pointer;font:inherit;font-weight:750;font-size:14px}
.choice{background:#fff6f1;border:1px solid #dbaeba;color:#79435b}
.choice:hover,.choice:focus-visible{background:#f8e4e9;border-color:#b76685}
.btn{border:0;color:#fff9f6;background:linear-gradient(130deg,#b15276,#8d3f60);box-shadow:0 7px 15px #b372863d;margin:10px 0}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.alt{border:1px solid #dbb4c3;background:#fff9f6;color:#955573;box-shadow:none}
.btn.narrow{width:auto;padding:12px 20px}
.feedback{margin:14px 0 3px;color:#985474;font-size:13px;font-weight:700;min-height:20px}
.cross-word{display:flex;gap:4px;margin:13px 0}
.cross-word span{min-width:28px;height:35px;display:grid;place-items:center;border-radius:5px;background:#f4d9df;border:1px solid #d6a4b5;font-family:Georgia,serif;font-size:18px;color:#7c3d58}
.pill-group{display:flex;flex-wrap:wrap;gap:7px;margin:13px 0}
.pill{font-size:11px;border:1px solid #e0b4c1;border-radius:30px;color:#8e536b;padding:6px 10px;background:#fae8e9}
.story-polaroid{width:min(240px,85%);padding:11px 11px 33px;background:#fffefb;box-shadow:0 9px 24px #95616e3b;transform:rotate(3deg);margin:17px auto 22px}
.story-polaroid .view{background:radial-gradient(circle at 70% 24%,#f9d4bc 0 7%,transparent 25%),linear-gradient(138deg,#d6a1ac,#a67e9d 65%,#806980);height:145px;display:grid;place-items:center;font-size:52px;color:white}
.story-polaroid .caption{font:italic 16px Georgia,serif;text-align:center;margin-top:10px;color:#94546e}
.stamp{display:inline-block;border:2px dashed #bd6887;padding:7px 11px;border-radius:6px;font-weight:900;font-size:12px;color:#ad5978;transform:rotate(-3deg);margin-top:9px;background:#fff8f0}
.footer{font-size:12px;color:#906d7e;text-align:center;margin:22px 0}
.locked{background:#f9eeee;border:1px dashed #e0b8c3;border-radius:13px;padding:15px;font-size:13px;margin:15px 0;color:#895d70}

@media(max-width:370px){.daily-grid .day-card{grid-template-columns:35px 1fr auto;gap:7px;padding:11px 8px}.day-icon{width:35px;font-size:24px}.day-card .day-status{min-width:45px;font-size:10px}.paper{padding:22px 14px}}
@media(prefers-reduced-motion:reduce){.day-card{transition:none}}

/* Longer daily releases: progress is gentle, large and readable on phones. */
.daily-progress{height:9px;overflow:hidden;background:#efd6d9;border-radius:99px;margin:17px 0 7px}
.daily-progress span{height:100%;display:block;background:linear-gradient(95deg,#a54a70,#dfa6b8);transition:width .25s;border-radius:99px}
.chapter-ribbon{font:italic 22px/1.25 Georgia,serif;display:table;margin:12px auto 18px;background:#f3d6dc;color:#813d59;padding:9px 18px;transform:rotate(-2deg);box-shadow:0 5px 10px #aa6a7930}
.daily-episode-head{margin:11px 0 3px;font-size:12px;line-height:1.55;color:#986578}
.daily-episode-head strong{color:#a65274}
.daily-done-stamp{border:2px dashed #ac607e;background:#fff7f0;padding:10px 14px;margin:18px auto;display:table;transform:rotate(-3deg);color:#994f6c;font-weight:900;font-size:12px;letter-spacing:1px}
.quiz-question{font:normal 24px/1.24 Georgia,serif;color:#75364f;margin:13px 0 20px}
.quiz-answer{display:block;margin:10px 0;padding:14px 16px;background:#fffefa;border:1px solid #dcb8c3;border-radius:13px;text-align:left;width:100%;font:700 15px/1.42 system-ui,sans-serif;color:#7e4460;cursor:pointer}
.quiz-answer:hover:not([disabled]),.quiz-answer:focus-visible{background:#f9e2ea;border-color:#ad6584}
.quiz-answer:disabled{opacity:.72;cursor:default}
.quiz-feedback{background:#f9ebed;border-left:4px solid #bb7996;padding:12px 14px;color:#81485f;font-size:13px;line-height:1.5;border-radius:0 9px 9px 0;margin:14px 0}
.chapter-clues{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0}
.chapter-clues span{display:grid;place-items:center;min-width:28px;height:34px;border-radius:5px;border:1px solid #d3a4b4;background:#f9e4e6;color:#8d4b66;font:17px Georgia,serif}
.day-status-note{font-size:12px;line-height:1.55;color:#927186;margin:10px 0}
.daily-frame{width:min(100%,230px);padding:10px 10px 32px;background:#fffdfa;box-shadow:0 9px 23px #8d5c7230;transform:rotate(3deg);margin:21px auto 22px;border:1px solid #f0e4e0}
.daily-frame-inner{height:124px;display:grid;place-items:center;font-size:54px;background:linear-gradient(130deg,#c7a1ad,#ddb6b9 53%,#e9ceb7)}
.daily-frame figcaption{font:italic 16px Georgia,serif;text-align:center;color:#8b4968;margin-top:10px}
.daily-clock-warning{background:#fff6ed;color:#925773;border:1px dashed #d5a8b7;border-radius:13px;padding:15px;line-height:1.6;font-size:13px;margin:20px 0}
.paper[data-theme="cream"]{background:linear-gradient(155deg,#fffdf6,#faebdf)}
.paper[data-theme="lilac"]{background:linear-gradient(155deg,#fffaf4,#efe7f6)}
.paper[data-theme="peach"]{background:linear-gradient(155deg,#fffaf6,#fbe0de)}
.paper[data-theme="gold"]{background:linear-gradient(155deg,#fffcf1,#f8ebd2)}
.paper[data-theme="dusk"]{background:linear-gradient(155deg,#fffaf5,#e8dff0)}
@media(prefers-reduced-motion:reduce){.daily-progress span{transition:none}}


.daily-custom-choice{border:1px dashed #bd7894!important;background:#fff1f4!important;color:#914d6e!important}
.daily-custom-form{margin:11px 0;padding:14px;border:1px solid #e0b8c5;border-radius:12px;background:#fffaf5}
.daily-custom-form label{display:block;font-size:13px;font-weight:750;margin-bottom:8px}
.daily-custom-form textarea{width:100%;min-height:85px;resize:vertical;padding:12px;border:1px solid #d2a4b5;border-radius:10px;font:15px/1.45 sans-serif;color:#672e48;background:#fffefa;box-sizing:border-box}
.daily-custom-form textarea:focus-visible{outline:3px solid #ca91a7}
.daily-host-link{background:none;border:0;border-top:1px dashed #d8b6be;color:#995d77;padding:13px 9px 5px;font:inherit;font-size:12px;cursor:pointer}
.daily-preview-note{background:#f9e1e8;color:#874561;border:1px dashed #c0849c;border-radius:11px;padding:12px;margin:12px 0 15px;font-size:12px;font-weight:700;line-height:1.5}

<body class="polaroid-site">
<div class="daily-shell">
 <div class="daily-top"><div class="daily-brand">♥ ОПЕРАЦИЯ 28.10</div><a href="index.html">← К приглашению</a></div>
 <main id="daily-root" class="paper" aria-live="polite"></main>
 <div class="footer">Для Лизы, с любовью и капелькой хитрости ♡<div style="margin-top:14px"><button type="button" id="host-daily-button" class="daily-host-link">🔧 Просмотр для ведущего</button></div></div>
</div>
<script src="host-full-test.js?v=1"></script>
<script>
'use strict';
const localStorage=window.SDTest.storage;
const DATE_KEY='sd2810-selected-day-v1',INVITE_KEY='sd2810-invite-approved-v3',BASE='sd2810-daily-v1';
const DAYS=[9,10,11,12,13,14],CAPTIONS=['Досье на Игоря','Мини-кросс про любовь','Правда или выдумка','Свидание твоей мечты','Финальный допуск','Последний секрет'];
const ICONS=['🕵️','✏️','🎞️','💗','🎟️','💌'],COLORS=['rose','cream','lilac','peach','gold','dusk'];
const SHORT=['9 ноября','10 ноября','11 ноября','12 ноября','13 ноября','14 ноября'];
const root=document.getElementById('daily-root');
let current=-1,episode=null,step=0,answers=[],working=false;
let organizerMode=false,previewMode=false;
const HOST_SESSION_KEY='sd2810-host-v3';
let clockEpoch=null,clockAnchor=0,clockError='',clockLoading=false;
const chosen=()=>localStorage.getItem(DATE_KEY);
const numberOfDays=()=>window.SDTest.active()||organizerMode?6:chosen()==='sun'?6:5;
const isInvited=()=>localStorage.getItem(INVITE_KEY)==='1'&&['sat','sun'].includes(chosen());
const nowTrusted=()=>clockEpoch===null?null:clockEpoch+(performance.now()-clockAnchor);
const safe=x=>String(x).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const freshState=()=>({version:2,done:{},answers:{}});
function state(){
 try{
  const value=JSON.parse(localStorage.getItem(BASE)||'null');
  if(value&&value.version===2&&value.done&&typeof value.done==='object'&&value.answers&&typeof value.answers==='object')return value;
 }catch(e){}
 return freshState();
}
function persist(st){
 try{localStorage.setItem(BASE,JSON.stringify(st));return true}
 catch(e){const el=document.getElementById('daily-save-status');if(el)el.textContent='Не удалось сохранить ответы. Проверь свободное место браузера.';return false}
}
function progressDone(){
 const st=state();return Array.from({length:numberOfDays()},(_,i)=>st.done[i]===true).filter(Boolean).length;
}
function phase(i){
 if(i<0||i>=numberOfDays())return 'absent';
 if(window.SDTest.active())return 'today';
 const when=nowTrusted();
 if(when===null)return 'verifying';
 const start=Date.UTC(2026,10,DAYS[i],6,0,0);  // 09:00 MSK
 const end=Date.UTC(2026,10,DAYS[i],21,0,0);  // 00:00 MSK, following day
 return when<start?'future':when>=end?'past':'today';
}
const available=i=>window.SDTest.active()||isInvited()&&phase(i)==='today';
const canContinue=()=>window.SDTest.active()||previewMode&&organizerMode||available(current);
function intro(){
 return '<div class="kicker">НАШ МАЛЕНЬКИЙ СЕРИАЛ • ОПЕРАЦИЯ 28.10</div>'
  +'<h1>Каждый день —<br><em>немного любви ♡</em></h1>'
  +'<p class="subtitle">Лиза, теперь каждый выпуск — это <b>15 лёгких романтических вопросов</b>. Примерно 5–7 минут улыбок и сюрпризов. Правильных ответов не требуем!</p>'
  +'<div class="daily-frame" aria-hidden="true"><div class="daily-frame-inner">♡ ✨</div><figcaption>Наши маленькие истории</figcaption></div>';
}
function renderHome(){
 current=-1;episode=null;previewMode=false;root.dataset.theme='rose';
 if(!isInvited()&&!organizerMode){
  root.innerHTML=intro()+'<div class="locked">🔒 Сначала открой приглашение, введи вашу дату-пароль и выбери день свидания.</div>'
  +'<a class="btn" style="display:block;text-align:center;text-decoration:none" href="index.html">Открыть приглашение 💌</a>';
  return;
 }
 let html=intro()+'<div class="day-count"><span class="day-badge">📖 Выпусков: '+numberOfDays()+'</span><span class="day-badge">💗 Печатей: '+progressDone()+' / '+numberOfDays()+'</span></div>';
 if(window.SDTest.active())html+='<div class="daily-preview-note">🔧 ПОЛНЫЙ ПРОХОД: пройди все 90 вопросов по очереди. Ответы сохраняются отдельно от данных Лизы. После последней главы откроется маршрут.</div>';
 if(nowTrusted()===null&&!window.SDTest.active()){
  html+='<div class="daily-clock-warning">🕒 '+safe(clockError||'Проверяем текущее московское время по сайту…')
   +'<p style="font-size:12px">Чтобы нельзя было открыть все дни сменой даты телефона, вход в игры работает только после проверки времени.</p>'
   +'<button type="button" id="clock-retry" class="btn">Повторить проверку времени</button></div>';
 }
 html+='<div class="daily-grid">';
 const st=state();
 for(let i=0;i<numberOfDays();i++){
  const today=phase(i),done=st.done[i]===true,active=organizerMode||today==='today';
  const subtitle=window.SDTest.active()?'Тестовый выпуск · ответы в отдельном хранилище':organizerMode?'Пробный просмотр · без сохранения':active?'15 вопросов · 5–7 минут':today==='past'?(done?'Пройденный выпуск — печать сохранена':'Время выпуска закончилось'):'Только '+SHORT[i]+', с 09:00 до 23:59 МСК';
  const status=window.SDTest.active()?(done?'✓ Пройдено':'🔧 Играть'):organizerMode?'👁 Смотреть':active?(done?'✓ Завершён':'Играть ♡'):today==='past'?(done?'✓ Печать':'Истёк'):today==='future'?'🔒 Скоро':'🔒';
  html+='<button type="button" class="day-card" data-open="'+i+'"'+(active?'':' disabled')+'>'
   +'<span class="day-icon">'+ICONS[i]+'</span><span><strong>'+SHORT[i]+' · '+CAPTIONS[i]+'</strong><small>'+subtitle+'</small></span>'
   +'<span class="day-status">'+status+'</span></button>';
 }
 html+='</div><p class="skip-note">Каждая игра доступна только в свой день с 09:00 до конца дня по Москве. Прошедшие выпуски остаются в списке, а заработанные печати сохраняются.</p>'
 +'<a href="index.html" class="btn alt" style="display:block;text-align:center;text-decoration:none">Вернуться к приглашению ♡</a>';
 root.innerHTML=html;
 const retry=root.querySelector('#clock-retry');
 if(retry)retry.addEventListener('click',()=>syncClock(true));
 root.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',()=>openDay(Number(el.dataset.open),organizerMode)));
}
function showUnavailable(){
 current=-1;episode=null;renderHome();
 const note=document.getElementById('daily-status');
 if(note)note.textContent='Этот выпуск можно проходить только в назначенный день.';
}
async function openDay(i,asPreview=false){
 const isPreview=asPreview&&organizerMode&&Number.isInteger(i)&&i>=0&&i<DAYS.length;
 if(!isPreview&&!available(i))return showUnavailable();
 if(working)return;
 working=true;previewMode=isPreview;current=i;episode=null;root.dataset.theme=COLORS[i];
 root.innerHTML='<div class="kicker">ВЫПУСК '+(i+1)+'</div><h2>Загружаем твою главу… ♡</h2><p>Ещё мгновение — и начнём.</p>';
 try{
  const response=await fetch('daily-content/day-'+DAYS[i]+'.json?v=2',{cache:'no-store'});
  if(!response.ok)throw new Error('HTTP '+response.status);
  const data=await response.json();
  if(data.date!==DAYS[i]||!Array.isArray(data.questions)||data.questions.length!==15||
     data.questions.some(q=>!Array.isArray(q)||typeof q[0]!=='string'||!Array.isArray(q[1])||q[1].length<2))
   throw new Error('Ошибка загрузки вопросов.');
  if(!canContinue()){working=false;return showUnavailable()}
  episode=data;
  const st=state(),saved=Array.isArray(st.answers[i])?st.answers[i]:[];
  answers=previewMode?[]:(saved.length<=15?saved.slice():[]);
  step=answers.length;working=false;
  if(step>=15){markComplete();showComplete()}else renderQuestion();
 }catch(e){
  working=false;
  root.innerHTML='<div class="kicker">НЕ ПОЛУЧИЛОСЬ ОТКРЫТЬ</div><h2>Глава пока не загрузилась</h2>'
   +'<p>Проверь интернет и попробуй ещё раз. Твой прогресс не потеряется.</p>'
   +'<p class="day-status-note">'+safe(e.message||'Сбой загрузки')+'</p>'
   +'<button class="btn" id="retry-day" type="button">Попробовать снова</button>'
   +'<button class="btn alt" id="back-to-list" type="button">К списку дней</button>';
  root.querySelector('#retry-day').addEventListener('click',()=>{working=false;openDay(i)});
  root.querySelector('#back-to-list').addEventListener('click',renderHome);
 }
}
function markComplete(){
 if(previewMode||current<0||answers.length!==15)return;
 const st=state();st.answers[current]=answers.slice();st.done[current]=true;st.version=2;persist(st);
}
function renderQuestion(){
 if(!episode||!canContinue())return showUnavailable();
 if(step>=15){markComplete();showComplete();return}
 root.dataset.theme=COLORS[current];
 const q=episode.questions[step],kind=episode.kind;
 const percent=Math.round(step/15*100);
 let html='<div class="kicker">'+SHORT[current]+' • ВЫПУСК '+(current+1)+'</div>'
  +'<div class="chapter-ribbon">'+safe(episode.title)+' ♡</div>'
  +(previewMode?'<div class="daily-preview-note">🔧 Просмотр ведущего: можно проверить все вопросы, ответы и печати Лизы не меняются.</div>':'')
  +'<div class="daily-episode-head"><strong>Вопрос '+(step+1)+' из 15</strong> · '+safe(episode.subtitle)+'</div>'
  +'<div class="daily-progress" role="progressbar" aria-valuemin="0" aria-valuemax="15" aria-valuenow="'+step+'"><span style="width:'+percent+'%"></span></div>'
  +'<p class="question-step">'+(step<5?'ПЕРВАЯ ГЛАВА':step<10?'ПРОДОЛЖАЕМ':'УЖЕ ПОЧТИ ФИНАЛ')+'</p>'
  +'<div class="quiz"><p class="quiz-question">'+safe(q[0])+'</p>';
 if(kind==='words')html+='<div class="chapter-clues">'+Array.from({length:Math.max(3,String(q[1][0]).length)},()=>'<span>♡</span>').join('')+'</div>';
 html+=q[1].map((answer,i)=>'<button type="button" class="quiz-answer" data-answer="'+i+'">'+safe(answer)+'</button>').join('')
  +'<button type="button" class="quiz-answer daily-custom-choice" id="daily-custom-toggle">✍️ Свой вариант ответа</button>'
  +'<form class="daily-custom-form" id="daily-custom-form" hidden><label for="daily-custom-input">Напиши свой ответ</label>'
  +'<textarea id="daily-custom-input" maxlength="180" required placeholder="Твой ответ… ♡" aria-describedby="daily-custom-error"></textarea>'
  +'<div class="day-status-note" id="daily-custom-error" role="status">До 180 символов.</div>'
  +'<button class="btn" type="submit">Сохранить мой ответ ♡</button></form>'
  +'<div id="daily-feedback" role="status"></div><div id="daily-save-status" class="day-status-note" role="status"></div></div>'
  +'<p class="day-status-note">'+(previewMode?'Это тестовое прохождение. Ничего не сохраняется.':'Ответы сохраняются после каждого вопроса. Можно закрыть страницу и вернуться в этот же день.')+'</p>'
  +'<button type="button" class="btn alt" id="back-to-list">← Сохранить и выйти</button>';
 root.innerHTML=html;
 root.querySelectorAll('[data-answer]').forEach(el=>el.addEventListener('click',()=>chooseAnswer(Number(el.dataset.answer))));
 root.querySelector('#daily-custom-toggle').addEventListener('click',()=>{
  const form=root.querySelector('#daily-custom-form');form.hidden=!form.hidden;
  if(!form.hidden)root.querySelector('#daily-custom-input').focus();
 });
 root.querySelector('#daily-custom-form').addEventListener('submit',event=>{
  event.preventDefault();chooseCustomAnswer(root.querySelector('#daily-custom-input').value);
 });
 root.querySelector('#back-to-list').addEventListener('click',renderHome);
}
function chooseCustomAnswer(raw){
 if(!episode||!canContinue())return showUnavailable();
 const value=String(raw||'').trim().replace(/\s+/g,' ').slice(0,180);
 if(!value){
  const warning=root.querySelector('#daily-custom-error');
  if(warning)warning.textContent='Напиши хотя бы пару слов — этот ответ будет только твоим. ♡';
  return;
 }
 recordAnswer({custom:value});
}
function chooseAnswer(choice){
 if(!episode||!canContinue())return showUnavailable();
 const q=episode.questions[step];
 if(!q||!Number.isInteger(choice)||choice<0||choice>=q[1].length)return;
 recordAnswer(choice);
}
function recordAnswer(value){
 if(!episode||!canContinue())return showUnavailable();
 if(answers.length!==step||step>=15)return;
 const custom=value&&typeof value==='object'&&typeof value.custom==='string';
 const q=episode.questions[step];
 if(custom&&(!value.custom.trim()||value.custom.length>180))return;
 if(!custom&&(!Number.isInteger(value)||value<0||value>=q[1].length))return;
 answers.push(value);
 let stored=true;
 if(!previewMode){
  const st=state();st.version=2;st.answers[current]=answers.slice();
  if(answers.length===15)st.done[current]=true;
  stored=persist(st);
 }
 root.querySelectorAll('[data-answer]').forEach(el=>el.disabled=true);
 const customButton=root.querySelector('#daily-custom-toggle');
 if(customButton)customButton.disabled=true;
 const form=root.querySelector('#daily-custom-form');
 if(form)form.hidden=true;
 const response=custom?'Твой собственный ответ принят: «'+value.custom+'». ♡':
  episode.kind==='mood'?'Записано в твоё романтическое досье! ❤️':
  episode.kind==='truth'?'По версии нашего секретного отдела: '+q[1][0]+'. ♡':
  episode.kind==='words'?'Загаданное слово: '+q[1][0]+'. Расшифровка принята. ♡':
  'Отличный выбор! Ещё одна маленькая частичка вашей истории. ♡';
 const area=root.querySelector('#daily-feedback');
 if(area)area.innerHTML='<div class="quiz-feedback">'+safe(response)+(previewMode?' Ответ не сохраняется в режиме ведущего.':stored?'':' Прогресс пока не сохранился на устройстве.')+'</div>';
 if(episode.kind==='words'&&!custom){
  const slots=root.querySelectorAll('.chapter-clues span');
  q[1][0].split('').forEach((letter,i)=>{if(slots[i])slots[i].textContent=letter});
 }
 const next=document.createElement('button');next.type='button';next.className='btn';
 next.textContent=answers.length===15?(previewMode?'Завершить просмотр ♡':'Получить печать ♡'):'Продолжить →';
 next.addEventListener('click',()=>{
  if(!canContinue())return showUnavailable();
  step=answers.length;
  if(step===15){markComplete();showComplete()}else renderQuestion();
 });
 if(area)area.appendChild(next);
}
function showComplete(){
 if(!episode||!canContinue())return showUnavailable();
 markComplete();
 const i=current;
 root.dataset.theme=COLORS[i];
 root.innerHTML='<div class="kicker">'+(window.SDTest.active()?'ПОЛНЫЙ ТЕСТ · ВЫПУСК '+(i+1):previewMode?'ПРОВЕРКА ВЕДУЩЕГО · ВЫПУСК '+(i+1):'ВЫПУСК '+(i+1)+' ЗАВЕРШЁН')+'</div>'
  +'<h1>'+(previewMode?'Проверка<br><em>завершена ♡</em>':'Миссия<br><em>пройдена! ♡</em>')+'</h1>'
  +'<div class="daily-frame" aria-hidden="true"><div class="daily-frame-inner">'+ICONS[i]+'</div><figcaption>'+safe(CAPTIONS[i])+'</figcaption></div>'
  +'<p>'+(previewMode?'Все 15 вопросов просмотрены, результаты Лизы не изменились.':'Все <b>15 вопросов</b> пройдены. Ты получила ещё одну печать в нашем романтическом альбоме!')+'</p>'
  +'<div class="daily-done-stamp">'+(previewMode?'🔧 ПРОСМОТР БЕЗ СОХРАНЕНИЯ':'✓ ДЕНЬ '+(i+1)+' • ПЕЧАТЬ ПОЛУЧЕНА')+'</div>'
  +'<p class="day-status-note">'+(previewMode?'Ни одна печать не начислена.':'Всего печатей: '+progressDone()+' из '+numberOfDays()+'. Они появятся в финальном отчёте.')+'</p>'
  +'<button type="button" class="btn" id="back-to-list">К списку дней →</button>'
  +(window.SDTest.active()?'<button type="button" class="btn" id="sd-next-full-test">'+(i===DAYS.length-1?'🚗 Перейти к полному GPS-квесту':'Следующий выпуск ('+SHORT[i+1]+') →')+'</button>':'');
 root.querySelector('#back-to-list').addEventListener('click',renderHome);
 if(window.SDTest.active())root.querySelector('#sd-next-full-test').addEventListener('click',()=>{
   if(i===DAYS.length-1)window.SDTest.navTo('secret_date_game_luga.html');
   else openDay(i+1,false);
 });
}
async function syncClock(showLoading){
 if(clockLoading)return;
 clockLoading=true;
 if(showLoading){clockError='';if(current<0)renderHome()}
 try{
  const url='daily.html?check='+Date.now();
  let result=await fetch(url,{method:'HEAD',cache:'no-store'});
  let dateHeader=result.headers?.get('date');
  if(!result.ok||!dateHeader){
   result=await fetch(url+'&retry=1',{cache:'no-store'});
   dateHeader=result.headers?.get('date');
  }
  const value=Date.parse(dateHeader||'');
  if(!result.ok||!Number.isFinite(value))throw new Error('Сайт не вернул подтверждённое время.');
  clockEpoch=value;clockAnchor=performance.now();clockError='';
 }catch(e){
  if(clockEpoch===null)clockError='Не получается проверить время на сервере. Подключись к интернету и повтори.';
 }finally{
  clockLoading=false;
  if(current>=0 && !canContinue())showUnavailable();
  else if(current<0)renderHome();
 }
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncClock(false)});
window.addEventListener('focus',()=>syncClock(false));
setInterval(()=>{if(current>=0&&!canContinue())showUnavailable();else if(current<0)renderHome()},30000);
setInterval(()=>syncClock(false),120000);
document.getElementById('host-daily-button').addEventListener('click',()=>{
 if(window.SDTest.active()){window.alert('Полное тестовое прохождение уже активно. Для выхода используй панель сверху.');return;}
 const button=document.getElementById('host-daily-button');
 if(organizerMode){
  organizerMode=false;previewMode=false;
  localStorage.removeItem(HOST_SESSION_KEY);
  button.textContent='🔧 Просмотр для ведущего';
  renderHome();return;
 }
 if(localStorage.getItem(HOST_SESSION_KEY)!=='1'){
  const go=window.confirm('Сначала активируй режим ведущего по коду в приглашении. Нажми подпись внизу страницы приглашения и введи код. Перейти туда?');
  if(go)window.location.href='index.html?replay=1';
  return;
 }
 organizerMode=true;previewMode=false;
 button.textContent='✕ Выйти из режима ведущего';
 renderHome();
});
persist(state());
if(window.SDTest.active()){
 organizerMode=false;previewMode=false;renderHome();
 const st=state();const first=DAYS.findIndex((_,i)=>st.done[i]!==true);
 if(first>=0)openDay(first,false);
 else showCompleteFromFullTest();
}else{renderHome();syncClock(true);}
function showCompleteFromFullTest(){
 root.innerHTML=intro()+'<div class="daily-preview-note">✓ Все шесть тестовых выпусков пройдены. Можешь продолжать проверку маршрута с самого начала.</div><button type="button" class="btn" id="sd-full-route">🚗 Начать GPS-квест</button>';
 root.querySelector('#sd-full-route').addEventListener('click',()=>window.SDTest.navTo('secret_date_game_luga.html'));
}

</script>
