name: Full host walkthrough checks

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "index.html"
      - "daily.html"
      - "daily-play.js"
      - "daily-dino.js"
      - "daily-dino-certificate.js"
      - "scripts/check-dino-certificate.mjs"
      - "daily-play.css"
      - "scripts/check-daily-play.mjs"
      - "scripts/check-series-menu.mjs"
      - "our-day.html"
      - "our-day.css"
      - "our-day.js"
      - "scripts/check-memory-album.mjs"
      - "daily-poetry.js"
      - "daily-poetry.css"
      - "poetry-data.json"
      - "poems/**"
      - "scripts/check-daily-poetry.mjs"
      - "secret_date_game_luga.html"
      - "story-flow.js"
      - "couple.html"
      - "couple-core.js"
      - "couple-app.js"
      - "daily-couple.js"
      - "scripts/check-couple-tests.mjs"
      - "scripts/check-couple-browser.mjs"
      - "story-flow.css"
      - "host-full-test.css"
      - "scripts/check-swipe-layout.mjs"
      - "scripts/check-strict-confirmations.mjs"
      - "scripts/check-zarechny-visit.mjs"
      - "scripts/check-deep-walkthrough.mjs"
      - "scripts/check-resume-memory.mjs"
      - "soundtrack.js"
      - "host-full-test.js"
      - "daily-content/**"
      - "scripts/check-full-host-test.mjs"
      - ".github/workflows/check-full-host-test.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-host-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install temporary DOM test environment
        run: npm install --no-save --no-package-lock jsdom@26.1.0
      - name: Verify isolated complete walkthrough
        run: |
          node scripts/check-full-host-test.mjs
          node scripts/check-swipe-layout.mjs
          node scripts/check-strict-confirmations.mjs
          node scripts/check-zarechny-visit.mjs
          node scripts/check-couple-tests.mjs
          node scripts/check-couple-browser.mjs
          node scripts/check-daily-poetry.mjs
          node scripts/check-daily-play.mjs
          node scripts/check-series-menu.mjs
          node scripts/check-dino-certificate.mjs
          node scripts/check-deep-walkthrough.mjs
          node scripts/check-resume-memory.mjs
          node scripts/check-memory-album.mjs
