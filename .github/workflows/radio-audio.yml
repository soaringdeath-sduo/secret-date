name: Build radio intercept audio

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/radio-audio.yml

permissions:
  contents: write

jobs:
  render-radio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install speech and audio tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak ffmpeg
      - name: Produce two dispatch versions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          cat > /tmp/radio-zap.txt <<'TEXT'
          Ш-ш... Внимание. Секретный канал активирован. Объект Л — ноль один обнаружен. Начальная точка: Заплюсье. Пункт назначения засекречен. Присутствие участницы подтверждено. Организатор подозрительно спокоен. Есть основания полагать, что он что-то скрывает. Вопрос протокола: доверяете ли вы своему водителю? Ответьте на экране. Конец связи.
          TEXT
          cat > /tmp/radio-luga.txt <<'TEXT'
          Ш-ш... Внимание. Секретный канал активирован. Объект Л — ноль один обнаружен. Начальная точка: Луга. Пункт назначения засекречен. Присутствие участницы подтверждено. Организатор подозрительно спокоен. Есть основания полагать, что он что-то скрывает. Вопрос протокола: доверяете ли вы своему водителю? Ответьте на экране. Конец связи.
          TEXT
          for mode in zap luga; do
            espeak -v ru -s 142 -p 39 -a 160 -f "/tmp/radio-$mode.txt" -w "/tmp/radio-$mode.wav"
            ffmpeg -hide_banner -loglevel error -y \
              -f lavfi -i "anoisesrc=color=pink:amplitude=0.06:duration=0.48:sample_rate=22050" \
              -i "/tmp/radio-$mode.wav" \
              -f lavfi -i "anoisesrc=color=pink:amplitude=0.07:duration=0.45:sample_rate=22050" \
              -filter_complex '[1:a]highpass=f=360,lowpass=f=2700,acompressor=threshold=-26dB:ratio=2.5:attack=20:release=150,volume=1.2[v];[0:a][v][2:a]concat=n=3:v=0:a=1,alimiter=limit=0.9[out]' \
              -map '[out]' -ar 22050 -ac 1 -c:a libmp3lame -b:a 48k "assets/radio-$mode.mp3"
          done
      - name: Commit generated sound files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/radio-zap.mp3 assets/radio-luga.mp3
          if ! git diff --cached --quiet; then
            git commit -m "Generate radio voice files for both departures"
            git push
          fi
