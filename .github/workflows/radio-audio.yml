name: Build natural radio messages

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/radio-audio.yml
      - scripts/build_radio_v2.py

permissions:
  contents: write

jobs:
  render-radio:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install speech and audio processing tools
        run: |
          python -m pip install --disable-pip-version-check --quiet edge-tts numpy scipy soundfile
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Generate male dispatcher recordings
        run: python scripts/build_radio_v2.py
      - name: Check both recordings
        run: |
          test -s assets/radio-zap-v2.mp3
          test -s assets/radio-luga-v2.mp3
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 assets/radio-zap-v2.mp3
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 assets/radio-luga-v2.mp3
      - name: Commit audio files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/radio-zap-v2.mp3 assets/radio-luga-v2.mp3
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate both dispatches with natural male voice and soft radio FX"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
