 omchino:{cat:'romance',label:'Тишина для двоих',emoji:'🌲',clue:'Спрятаться от суеты и услышать друг друга.',place:'озеро Омчино',stop:'lake',kind:'gps',message:'Пикник у озера и любимые роллы.'},
 toloni:{cat:'romance',label:'Зеркало желаний',emoji:'✨',clue:'Место для маленьких желаний.',place:'озеро Большие Толони',stop:'toloni',kind:'gps',message:'Загадаем по одному желанию друг для друга.'},
 zarechny:{cat:'romance',label:'Огни нашей истории',emoji:'💫',clue:'Ещё одна прогулка среди деревьев.',place:'Заречный парк',stop:'zarechny',kind:'gps',message:'Сосны, дорожки и наши разговоры.'},

 anticafe:{cat:'adventure',label:'Территория хитрости',emoji:'🎲',clue:'Настольные игры и маленькие соревнования.',place:'антикафе «Убойные посиделки» в Луге',kind:'manual',message:'Уютные игры и маленькие соревнования вдвоём.',notice:'Режим работы, игровую зону и условия посещения нужно уточнить заранее.'},

 thriller:{cat:'cinema',label:'Пощекотать нервы',emoji:'👻',clue:'Ужасы или триллер.',place:'киноцентр «Смена» в Луге',kind:'cinema',message:'История, от которой хочется прижаться ближе.'},
 comedy:{cat:'cinema',label:'Посмеяться вместе',emoji:'😂',clue:'Весёлая комедия.',place:'киноцентр «Смена» в Луге',kind:'cinema',message:'Смеяться над одной историей вдвоём.'},
 lovefilm:{cat:'cinema',label:'История любви',emoji:'💞',clue:'Романтический фильм.',place:'киноцентр «Смена» в Луге',kind:'cinema',message:'Романтическая история для двоих.'}
};
const OPT_IDS=Object.keys(ENDINGS);
const PLAN_KEY='sd2810-plan-v1';
const DEFAULT_MASK=0x1e7;
function parseMask(q){if(!/^[0-9a-f]{1,3}$/i.test(q||''))return null;const n=parseInt(q,16);return n>0&&n<=0x1ff?n:null}
const incomingPlan=parseMask(new URLSearchParams(window.location.search).get('plan'));
if(incomingPlan!==null)localStorage.setItem(PLAN_KEY,String(incomingPlan));
const getMask=()=>{const v=Number(localStorage.getItem(PLAN_KEY));return Number.isInteger(v)&&v>0&&v<=0x1ff?v:DEFAULT_MASK};
const allowed=id=>{const i=OPT_IDS.indexOf(id);return i>=0&&!!(getMask()&(1<<i))};

const QUEST_GIFTS=[

 {icon:'✨',name:'Конверт №3',title:'Билет в будущее',text:'Придумайте одну совместную поездку или приключение на следующий месяц.'}
];
const freshQuest=()=>({phase:'intro',round:0,liza:null,score:0,truth:null,envelope:null,complete:false,day:localStorage.getItem(DATE_KEY)});
function getQuest(){
 try{
 const q=JSON.parse(localStorage.getItem(QUEST_KEY)||'null');
 if(!q||q.day!==localStorage.getItem(DATE_KEY)||!['intro','askL','handoff','askI','result','truthSelect','truthTask','envelopeSelect','envelopeTask','ready'].includes(q.phase)||!Number.isInteger(q.round)||q.round<0||q.round>3)return freshQuest();
 return q;
 }catch(e){return freshQuest()}
}

const finalChoice=()=>{const id=localStorage.getItem(END_KEY);return allowed(id)?ENDINGS[id]||null:null};

function questHTML(){
 const q=getQuest(),round=QUEST_Q[Math.min(q.round,2)];

 const heading=(s,t)=>`<div class="bloom">${s}</div><h1 class="hero">${t}</h1>`;
 const next=(label,action,value='')=>`<button class="btn primary" type="button" data-quest-action="${action}" data-value="${value}">${label}</button>`;
 const answerButtons=(who)=>`<div class="secret-options">${round.choices.map((x,i)=>`<button class="secret-option" type="button" data-quest-action="${who}" data-value="${i}"><span style="font-size:24px">${i+1}.</span><span><strong>${x}</strong></span></button>`).join('')}</div>`;

 case 'handoff':
 content=heading('🔐','Ответ <em>запечатан.</em>')+
  `<p class="desc">Ответ Лизы сохранён и скрыт. Теперь передай телефон Игорю: его очередь ответить на тот же вопрос, не подсматривая!</p>
  <div class="mini"><p>Раунд ${q.round+1} из 3. Совпадения дают виртуальные сердечки, но главное — узнать друг друга ещё лучше.</p></div>

 case 'askI':
 content=heading('🧠','Игорь, твой <em>ответ.</em>')+
  `<div class="route-tag">Вопрос ${q.round+1} из 3 • Отвечает Игорь</div>
  <p class="desc">${round.title} Выбирай честно, не расспрашивая Лизу о её ответе.</p>${answerButtons('answerI')}`;break;
 case 'result':
 content=heading(q.match?'💞':'🌷',q.match?'У вас <em>совпадение!</em>':'Вы <em>разные — и это классно.</em>')+
  `<p class="desc">Лиза выбрала: <b>${round.choices[q.liza]}</b>. За совпадения — сердечки, за разные ответы — интересные разговоры.</p>
  <div class="mini"><h3>💗 Сердечки: ${q.score} из 3</h3><p>Не соревнование, а повод улыбнуться вместе.</p></div>
  ${next(q.round===2?'Ко второму испытанию →':'Следующий вопрос →','nextRound')}`;break;
 case 'truthSelect':
 content=heading('🎭','Правда или <em>желание?</em>')+
  `<p class="desc">Выберите, чего вам хочется сейчас. Можно не выполнять то, что кажется неудобным.</p>

 case 'truthTask':{

 case 'envelopeSelect':

 case 'envelopeTask':{

 content=heading(gift.icon,gift.title)+`<div class="mini"><h3>Ваш секрет</h3><p>${gift.text}</p></div>${next('Задание выполнено ♥','completeEnvelope')}`;break;}
 case 'ready':

 return `${start}${content}<div class="spacer"></div>

function questAction(action,val){
 if(!canStart()||stage!==12||localStorage.getItem(END_KEY)!=='minigame')return;
 const q=getQuest();
 if(action==='start'&&q.phase==='intro'){q.phase='askL';setQuest(q);return;}
 if(action==='answerL'&&q.phase==='askL'&&/^[0-2]$/.test(val)){q.liza=+val;q.phase='handoff';setQuest(q);return;}
 if(action==='handoff'&&q.phase==='handoff'){q.phase='askI';setQuest(q);return;}
 if(action==='answerI'&&q.phase==='askI'&&/^[0-2]$/.test(val)){q.match=q.liza===+val;if(q.match)q.score++;q.phase='result';setQuest(q);return;}
 if(action==='nextRound'&&q.phase==='result'){if(q.round<2){q.round++;q.liza=null;q.match=false;q.phase='askL';}else q.phase='truthSelect';setQuest(q);return;}
 if(action==='chooseTruth'&&['truthSelect','truthTask'].includes(q.phase)&&QUEST_TASKS[val]){q.truth=val;q.phase='truthTask';setQuest(q);return;}
 if(action==='finishTruth'&&q.phase==='truthTask'){q.phase='envelopeSelect';setQuest(q);return;}
 if(action==='openEnvelope'&&q.phase==='envelopeSelect'&&/^[0-2]$/.test(val)){q.envelope=+val;q.phase='envelopeTask';setQuest(q);return;}
 if(action==='completeEnvelope'&&q.phase==='envelopeTask'){q.phase='ready';setQuest(q);return;}
 if(action==='finishQuest'&&q.phase==='ready'){q.complete=true;localStorage.setItem(QUEST_KEY,JSON.stringify(q));save(13,'quest');return;}
}

function setupGateTicker(){
 if(gateTicker!==null){clearInterval(gateTicker);gateTicker=null;}
 if(canStart()||!invited()||!getChosenDay())return;
 gateTicker=setInterval(()=>{
   if(canStart()){clearInterval(gateTicker);gateTicker=null;render();return;}
   const el=document.getElementById('gate-countdown');if(el)el.textContent=formatWait(eventStartUTC()-Date.now());
 },1000);
}

 <div class="mini"><h3>Подарок со смыслом</h3><p>Не обязательно покупать что-то огромное, чтобы показать: я помню, что ты любишь. Но пакет пока не открывать — впереди ещё одна точка ♥</p></div>
 <div class="spacer"></div>${btn('Роллы забраны — едем дальше ♥','go')}`;
 case 10:return `<div class="eyebrow">Глава 08 • Твой выбор</div><div class="bloom">💌</div><h1 class="hero">Каким будет <em>наш финал?</em></h1>
 <p class="desc">После этой маленькой хитрости хочется подарить тебе настоящее свидание. Выбери настроение — и затем один из секретных вариантов. ❤️</p>
 <div class="category-options">${enabledCategories().map(cat=>`<button class="category-option" type="button" data-cat="${cat}"><strong>${CATEGORIES[cat].label}</strong><small>${CATEGORIES[cat].clue}</small></button>`).join('')}</div>
 <p class="small">Точные места пока останутся секретом.</p>`;
case 11:return `<div class="eyebrow">Глава 09 • Вторая тайна</div><div class="bloom">💗</div><h1 class="hero">Выбери, что <em>по душе.</em></h1>
 <div class="route-tag">${CATEGORIES[chosenCategory()]?.label||'Тайный выбор'}</div>
 <p class="desc">Что скрывается за красивым названием? Узнаешь совсем скоро 😉</p>
 <div class="secret-options">${enabledEndings(chosenCategory()).map(([id,e])=>`<button class="secret-option" type="button" data-ending="${id}"><span style="font-size:29px">${e.emoji}</span><span><strong>${e.label}</strong><small>${e.clue}</small></span></button>`).join('')}</div>
 <button id="back-category" type="button" class="link" style="text-align:center;margin-top:12px">← Другое настроение</button>`;
case 12:if(finalChoice()?.kind==='quest')return questHTML();return `<div class="eyebrow">Глава 10 • Почти разгадка</div><div class="bloom">${finalChoice()?.emoji||'💗'}</div><h1 class="hero">Тайна <em>выбрана!</em></h1>
 <div class="route-tag">${finalChoice()?.label||'Тайна'}</div>
 <p class="desc">Доверь дорогу и приготовления Игорю. Настоящее название места узнаешь, когда наш сюрприз состоится.</p>
 <div class="mini"><h3>💌 Поделиться выбором</h3><p>Сообщи Игорю название своей тайны в Telegram, если он не видел твой ответ.</p><a class="btn second btn-link" href="${'https://t.me/share/url?url='+encodeURIComponent('https://soaringdeath-sduo.github.io/secret-date/')+'&text='+encodeURIComponent('Игорь, я выбрала «'+(finalChoice()?.label||'сюрприз')+'» ❤️')}" target="_blank" rel="noopener noreferrer">Сообщить Игорю в Telegram ✉️</a><p class="small">Не забудь выбрать чат и нажать «Отправить».</p></div>
 ${finalChoice()?.kind==='gps'?
  `<p class="desc">Мы едем в одно секретное место. После парковки проверь GPS и открой финал.</p>${check('📍 Мы на месте — открыть сюрприз')}${foot()}`:
  finalChoice()?.kind==='cinema'?
  `<div class="coords"><strong>🎬 ${finalChoice()?.label}</strong><div class="small">Игорь проверяет актуальные сеансы киноцентра «Смена» на выбранную дату и покупает билеты. Сайт не бронирует кино автоматически.</div></div>
  <div class="mini"><h3>Подтвердить настоящий сеанс</h3><p>После проверки афиши укажите название фильма и время.</p>
  <input id="movie-title" type="text" maxlength="80" aria-label="Название фильма" placeholder="Название фильма" style="width:100%;padding:12px;margin:7px 0;background:#261d31;color:white;border:1px solid #82607c;border-radius:10px">
  <input id="movie-time" type="time" aria-label="Время сеанса" style="width:100%;padding:12px;margin:7px 0;background:#261d31;color:white;border:1px solid #82607c;border-radius:10px"><div class="status" id="movie-error"></div>
  ${btn('Сеанс согласован — открыть финал','movie-confirm')}</div>`:
  `<div class="coords"><strong>🎲 Готовимся к приключению</strong><div class="small">${finalChoice()?.notice||''}</div></div>
  <p class="desc">Когда поиграете или выполните задания, откройте финальное послание.</p>${btn('Приключение состоялось ♥','manual-finish')}`}
 <button id="change-ending" type="button" class="link" style="text-align:center;margin-top:14px">← Выбрать другое тайное место</button>`;
case 13:return `<div class="heart-rain" aria-hidden="true">${Array.from({length:21},(_,i)=>`<i style="--x:${(i*37)%96}%;--s:${15+i%6*4}px;--t:${5+i%5}s;--d:-${i*.39}s">♥</i>`).join('')}</div>
 <div class="over" style="display:flex;flex-direction:column;flex:1"><div class="eyebrow">Финал • Настоящее свидание</div><div class="bloom">💐</div>
 <h1 class="hero" style="text-align:center">Лиза, <em>я тебя люблю.</em></h1>
 <p class="desc" style="text-align:center">Да, первое «свидание» было шуткой. Но всё, что дальше, — настоящее. И я хотел тебя приятно удивить.</p>
 <div class="final-date"><span>НАСТОЯЩЕЕ РОМАНТИЧЕСКОЕ СВИДАНИЕ</span><b>${eventDate()}</b><b>Начало: ${SETTINGS.eventTime} · г. Луга</b><span>Наша тайна: ${finalChoice()?.place||'особенное место'} ♥</span></div>
 <div class="mini"><p style="text-align:center">${finalChoice()?.message||'Ты для меня очень важна.'}</p>${finalChoice()?.kind==='quest'?`<p style="text-align:center">🏆 Операция 28.10 завершена. Сердечки: ${getQuest().score} из 3. Сертификат совместимости выдан бессрочно. 💝</p>`:''}${finalChoice()?.kind==='cinema'&&movieInfo()?`<p style="text-align:center">🎬 ${escapeText(movieInfo().title)} · ${escapeText(movieInfo().time)}</p>`:''}<p style="text-align:center;font-family:Georgia,serif;font-size:20px;color:#ffe5ed">«Ты хотела неожиданностей.<br>А я просто хочу быть рядом с тобой». ❤️</p></div>
 <div class="spacer"></div>${btn('Обнять Игоря ♥','hug')}<p id="hug-text" class="small" style="text-align:center;min-height:16px"></p></div>`;
 }
};
function render(){
 stopWatch();app.innerHTML=stageHTML();app.style.animation='none';void app.offsetWidth;app.style.animation='appear .48s ease both';
 displayHostBar();setupGateTicker();
 if(!canStart())return;
 const go=document.getElementById('go');
 if(go)go.addEventListener('click',()=>save({1:2,3:4,4:5,5:6,6:7,8:9,9:10}[stage]??stage));
 app.querySelectorAll('[data-cat]').forEach(el=>el.addEventListener('click',()=>chooseCategory(el.dataset.cat)));
 app.querySelectorAll('[data-ending]').forEach(el=>el.addEventListener('click',()=>chooseEnding(el.dataset.ending)));
 app.querySelectorAll('[data-quest-action]').forEach(el=>el.addEventListener('click',()=>questAction(el.dataset.questAction,el.dataset.value||'')));
 const change=document.getElementById('change-ending');if(change)change.addEventListener('click',()=>{localStorage.removeItem(END_KEY);localStorage.removeItem(QUEST_KEY);save(11,'back')});
 const backCat=document.getElementById('back-category');if(backCat)backCat.addEventListener('click',()=>save(10));
 const manualFinish=document.getElementById('manual-finish');if(manualFinish)manualFinish.addEventListener('click',()=>save(13));
 const movieConfirm=document.getElementById('movie-confirm');if(movieConfirm)movieConfirm.addEventListener('click',()=>{
  const title=(document.getElementById('movie-title').value||'').trim(),time=(document.getElementById('movie-time').value||'').trim();
  if(!title||!/^([01]\d|2[0-3]):[0-5]\d$/.test(time)){document.getElementById('movie-error').textContent='Укажите название фильма и время сеанса (ЧЧ:ММ).';return;}
  localStorage.setItem(MOVIE_KEY,JSON.stringify({key:localStorage.getItem(END_KEY),title:title.slice(0,80),time}));save(13);
 });
 const snackYes=document.getElementById('snack-yes');if(snackYes)snackYes.addEventListener('click',()=>save(8));
 const snackNo=document.getElementById('snack-no');if(snackNo)snackNo.addEventListener('click',()=>save(9));
 const skipSnack=document.getElementById('skip-snack');if(skipSnack)skipSnack.addEventListener('click',()=>save(9));
 const checkButton=document.getElementById('check');if(checkButton)checkButton.addEventListener('click',checkPosition);
 const show=document.getElementById('show-help');if(show)show.addEventListener('click',()=>{helpOpen=!helpOpen;document.getElementById('help').classList.toggle('hidden',!helpOpen)});
 const helpGo=document.getElementById('help-go');if(helpGo)helpGo.addEventListener('click',()=>{
  const val=(document.getElementById('help-code').value||'').trim().toLowerCase();
  if(val!==SETTINGS.helpCode.toLowerCase()){document.getElementById('help-status').textContent='Код не подошёл. Попроси Игоря помочь.';return}
  if(stage===0){document.getElementById('help-status').textContent='Доступ открыт. Укажи место начала поездки.';document.getElementById('manual-start').classList.remove('hidden');}
  else unlock();
 });
 const startZap=document.getElementById('start-zap');if(startZap)startZap.addEventListener('click',()=>setOrigin('zap'));
 const startLuga=document.getElementById('start-luga');if(startLuga)startLuga.addEventListener('click',()=>setOrigin('luga'));
 const quit=document.getElementById('quit');if(quit)quit.addEventListener('click',()=>{quit.textContent='Хорошо ♥ Можешь остановиться в любой момент';go.textContent='Всё-таки продолжить →'});
 const hug=document.getElementById('hug');if(hug)hug.addEventListener('click',()=>{document.getElementById('hug-text').textContent='Теперь откладывай телефон и обнимай. ❤️';hug.textContent='♥♥♥'});
 if(locAllowed && [2,12].includes(stage))startWatch();
 updateStatus(geoStatus);
}
function desiredStop(){return stage===2?'lenta':stage===12&&finalChoice()?.kind==='gps'?(finalChoice()?.stop||null):null}
function nextStage(){return stage===2?3:stage===12?13:stage}
function unlock(){save(nextStage())}
function haversine(lat1,lon1,lat2,lon2){const R=6371000,toRad=x=>x*Math.PI/180;const a=Math.sin(toRad(lat2-lat1)/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(toRad(lon2-lon1)/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))}
function inZone(p,name){const stop=SETTINGS.stops[name];return p.coords.accuracy<=stop.accuracy && haversine(p.coords.latitude,p.coords.longitude,stop.lat,stop.lon)<=stop.radius}
function detectOrigin(p){
 if(inZone(p,'zap'))return 'zap';
 if(inZone(p,'luga'))return 'luga';
 return null;
}
function updateStatus(message){const el=document.getElementById('geo-status');if(el)el.textContent=message||''}
function onPosition(p,expectedStage,auto){
 if(!canStart()||stage!==expectedStage)return;
 locAllowed=true;
 if(expectedStage===0){
  const mode=detectOrigin(p);
  if(mode){setOrigin(mode);return}
  geoStatus=p.coords.accuracy>SETTINGS.stops.zap.accuracy?'GPS пока недостаточно точен. Попробуй на открытом месте или используй код ведущего.':'Ты пока не в Заплюсье и не в пределах Луги. Начните игру при встрече или воспользуйтесь ручным выбором.';
  updateStatus(geoStatus);return;
 }
 const target=desiredStop();if(!target)return;
 if(inZone(p,target)){geoStatus='✓ Вы прибыли в нужное место!';updateStatus(geoStatus);unlock();return}
 geoStatus=p.coords.accuracy>SETTINGS.stops[target].accuracy?'GPS определил местоположение недостаточно точно. Попробуйте ещё раз у окна или на открытом месте.':'GPS работает. До нужной точки ещё не добрались. Следующий этап откроется после прибытия.';
 updateStatus(geoStatus);
 if(!auto)startWatch();
}
function onError(e){geoStatus=e.code===1?'Доступ к геолокации запрещён. Откройте сайт через HTTPS в Chrome и проверьте разрешения сайта и телефона. Можно воспользоваться ручным переходом.':e.code===2?'Местоположение не определилось. Проверьте, включён ли GPS, или используйте ручной переход.':'GPS не успел ответить. Попробуйте ещё раз или воспользуйтесь кодом ведущего.';updateStatus(geoStatus)}
function checkPosition(){
 if(!canStart()){render();return;}
 if(!navigator.geolocation||!window.isSecureContext){updateStatus('Для работы GPS открой игру по защищённой HTTPS-ссылке (GitHub Pages) в обычном браузере Chrome.');return}
 const expectedStage=stage;
 updateStatus('Определяем местоположение… Браузер может запросить разрешение на GPS.');
 try{navigator.geolocation.getCurrentPosition(p=>onPosition(p,expectedStage,false),onError,{enableHighAccuracy:true,timeout:18000,maximumAge:0})}
 catch(e){updateStatus('Браузер не смог запустить GPS. Открой ссылку по HTTPS в Chrome или используй ручной переход.')}
}
function startWatch(){
 if(watchID!==null||!navigator.geolocation||!window.isSecureContext||!desiredStop())return;
 const expectedStage=stage;
 watchID=navigator.geolocation.watchPosition(p=>onPosition(p,expectedStage,true),onError,{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
}
function stopWatch(){if(watchID!==null&&navigator.geolocation)navigator.geolocation.clearWatch(watchID);watchID=null}
window.addEventListener('pagehide',stopWatch);
function chooseHostStage(){
 if(!isHost())return;
 const choice=prompt('Тестовый экран 0–13. 0 — старт, 7 — перекус, 9 — Сакура, 10 — категории, 11 — варианты, 12 — GPS/сеанс, 13 — финал.', String(stage));
 if(choice===null||!/^(?:[0-9]|1[0-3])$/.test(choice.trim()))return;
 const target=Number(choice.trim());
 if(target===0){origin=null;localStorage.removeItem(MODEKEY);save(0);return;}
 if(!origin){origin='zap';localStorage.setItem(MODEKEY,origin);}
 if(target>=11&&!chosenCategory())localStorage.setItem(CAT_KEY,'romance');
 if(target>=12&&!finalChoice())localStorage.setItem(END_KEY,'omchino');
 save(target);
}
function chooseHostOrigin(){
 if(!isHost())return;
 const choice=prompt('Точка старта: 1 — Заплюсье, 2 — Луга',origin==='luga'?'2':'1');
 if(choice==='1'||choice==='2')setOrigin(choice==='1'?'zap':'luga');
}
function endHostMode(){
 localStorage.removeItem(HOST_KEY);
 render();
}
function renderHostConfig(){
 const box=document.getElementById('host-config');if(!box)return;
 box.classList.toggle('hidden',!isHost()||!configOpen);
 if(!isHost()||!configOpen)return;
 box.className='host-config';
 const groups=Object.keys(CATEGORIES).map(cat=>`<h4 class="group-name">${CATEGORIES[cat].label}</h4>${Object.entries(ENDINGS).filter(([,e])=>e.cat===cat).map(([id,e])=>`<label><input type="checkbox" data-plan-opt="${id}" ${allowed(id)?'checked':''}><span>${e.label}</span></label>`).join('')}`).join('');
 const link=new URL('index.html',window.location.href);
 link.searchParams.set('plan',getMask().toString(16));
 box.innerHTML=`<p class="small">Сними галочки с недоступных развлечений. Затем отправь Лизе ссылку ниже — она передаст эти настройки на её телефон.</p>
 ${groups}<button id="host-plan-save" type="button">Сохранить и обновить ссылку</button>
 <input id="host-share-link" type="text" aria-label="Ссылка для Лизы" readonly value="${link.href}">
 <button id="host-plan-copy" type="button">Скопировать ссылку</button>
 <p class="small" id="host-plan-status">Для изменения вариантов на телефоне Лизы отправь ей новую ссылку с настройками.</p>`;
 document.getElementById('host-plan-save').addEventListener('click',()=>{
  let mask=0;box.querySelectorAll('[data-plan-opt]').forEach(el=>{if(el.checked)mask|=(1<<OPT_IDS.indexOf(el.dataset.planOpt));});
  if(mask===0){document.getElementById('host-plan-status').textContent='Оставь хотя бы один доступный вариант.';return;}
  localStorage.setItem(PLAN_KEY,String(mask));
  if(!finalChoice()){localStorage.removeItem(END_KEY);if(stage>=12){save(10);return;}}
  render();
 });
 document.getElementById('host-plan-copy').addEventListener('click',()=>{
  const input=document.getElementById('host-share-link');
  input.focus();input.select();
  const status=document.getElementById('host-plan-status');
  if(navigator.clipboard?.writeText)navigator.clipboard.writeText(input.value).then(()=>{status.textContent='Ссылка скопирована — отправь её Лизе.'},()=>{status.textContent='Скопируй выделенную ссылку вручную.'});
  else status.textContent='Скопируй выделенную ссылку вручную.';
 });
}
document.getElementById('host-stage').addEventListener('click',chooseHostStage);
document.getElementById('host-origin').addEventListener('click',chooseHostOrigin);
document.getElementById('host-ending').addEventListener('click',()=>{if(!isHost())return;
 const choices=OPT_IDS.map((id,i)=>`${i+1} — ${ENDINGS[id].place}`).join('\n');
 const picked=prompt('Выбери финал для теста:\n'+choices,'1');
 const id=OPT_IDS[Number(picked)-1];if(!id)return;
 if(!allowed(id)){alert('Этот вариант выключен. Сначала включи его в доступности.');return;}
 localStorage.setItem(CAT_KEY,ENDINGS[id].cat);chooseEnding(id);
});
document.getElementById('host-settings').addEventListener('click',()=>{if(!isHost())return;configOpen=!configOpen;renderHostConfig();});
document.getElementById('host-exit').addEventListener('click',endHostMode);
document.getElementById('organizer').addEventListener('click',()=>{
 if(++adminClicks<6)return;adminClicks=0;
 const code=prompt('Режим ведущего. Введите код:');
 if((code||'').trim().toLowerCase()!==SETTINGS.helpCode.toLowerCase())return;
 localStorage.setItem(HOST_KEY,'1');
 render();
});
window.addEventListener('pagehide',()=>{if(gateTicker!==null)clearInterval(gateTicker)});
window.addEventListener('storage',e=>{if(e.key===DATE_KEY)render();});
render();
</script>
