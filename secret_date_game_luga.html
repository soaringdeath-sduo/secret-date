}

const PHOTO_KEY_PREFIX='sd2810-local-camera-v1';

function getPhoto(i){
 if(!Number.isInteger(i)||i<0||i>2)return null;
 try{
  const value=localStorage.getItem(photoKey(i));
  return typeof value==='string'&&value.length<1300000&&/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(value)?value:null;
 }catch(e){return null}

let photoStream=null,photoLayer=null,photoIndex=null,pendingNativePhotoIndex=null,photoFacing='environment',photoOpening=0;
function stopPhotoCamera(){
 photoOpening++;
 if(photoStream){for(const track of photoStream.getTracks())track.stop();photoStream=null;}
 if(photoLayer){photoLayer.remove();photoLayer=null;}

}

function cameraFileFallback(){

 input.value='';

}
function photoSaveCanvas(sourceWidth,sourceHeight,draw){
 const maxSide=920;
 const scale=Math.min(1,maxSide/Math.max(sourceWidth,sourceHeight));
 const width=Math.max(1,Math.round(sourceWidth*scale));
 const height=Math.max(1,Math.round(sourceHeight*scale));
 const canvas=document.createElement('canvas');
 canvas.width=width;canvas.height=height;
 const ctx=canvas.getContext('2d');
 if(!ctx)throw new Error('Браузер не поддерживает сохранение снимка.');
 draw(ctx,width,height);
 const data=canvas.toDataURL('image/jpeg',.74);
 if(!data.startsWith('data:image/jpeg;base64,'))throw new Error('Не удалось обработать фотографию.');
 return data;
}
function acceptPhoto(index,data){
 if(stage!==6||!canStart()||!Number.isInteger(index)||index<0||index>2)return;
 const count=photoStoredCount(),m=readMissions();
 if(m.photos===-1){photoStatus('Фотоохота уже пропущена.');return;}
 if(index>count){photoStatus('Сначала сделай предыдущий кадр.');return;}
 try{localStorage.setItem(photoKey(index),data)}
 catch(e){photoStatus('Не хватает памяти браузера для снимка. Освободи место или выбери «Без фото».');return}
 m.photos=photoStoredCount();
 localStorage.setItem(MISSIONS_KEY,JSON.stringify(m));
 stopPhotoCamera();render();
}
async function startPhotoStream(){
 if(!photoLayer||photoIndex===null)return;
 const token=++photoOpening;
 if(photoStream){for(const track of photoStream.getTracks())track.stop();photoStream=null;}
 const video=photoLayer.querySelector('video'),shutter=photoLayer.querySelector('#camera-shutter');
 const message=photoLayer.querySelector('#camera-state');
 if(shutter)shutter.disabled=true;
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.isSecureContext){
  if(message)message.textContent='Встроенная камера недоступна. Нажми «Камера телефона / выбрать фото».';
  return;
 }
 try{
  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:photoFacing},width:{ideal:1280},height:{ideal:960}},audio:false});
  if(token!==photoOpening||!photoLayer){for(const t of stream.getTracks())t.stop();return;}
  photoStream=stream;video.srcObject=stream;
  video.classList.toggle('selfie',photoFacing==='user');
  await video.play();
  if(token!==photoOpening)return;
  if(shutter)shutter.disabled=false;
  if(message)message.textContent='Камера готова. Сделай кадр — он сохранится только в этом браузере.';
 }catch(e){
  if(token!==photoOpening)return;
  if(message)message.textContent='Не удалось открыть камеру. Разреши доступ или воспользуйся кнопкой выбора фото.';
 }
}
function openPhotoCamera(index){

 if(!Number.isInteger(index)||index<0||index>2||index>photoStoredCount())return;
 stopPhotoCamera();
 photoIndex=index;photoFacing=index===2?'user':'environment';
 const layer=document.createElement('div');
 layer.className='camera-overlay';
 layer.innerHTML='<div class="camera-frame" role="dialog" aria-modal="true" aria-label="Камера фотоохоты">'
  +'<div class="camera-head"><span>📸 '+(index+1)+' / 3 — '+PHOTO_NAMES[index]+'</span><button type="button" class="camera-close" id="camera-close" aria-label="Закрыть камеру">×</button></div>'
  +'<div class="camera-view"><video id="camera-video" autoplay muted playsinline></video></div>'
  +'<div class="camera-actions"><button type="button" class="camera-shutter" id="camera-shutter" disabled>📸 Сделать снимок</button>'
  +'<button type="button" class="camera-flip" id="camera-flip" aria-label="Сменить камеру">↺</button></div>'
  +'<p id="camera-state" class="camera-help">Запрашиваем разрешение на использование камеры…</p>'
  +'<button type="button" class="photo-backup" id="camera-native">📱 Камера телефона / выбрать фото</button>'
  +'<p class="camera-help">Фотография останется в браузере этого телефона. Никому не отправляется.</p></div>';
 document.body.appendChild(layer);photoLayer=layer;
 layer.querySelector('#camera-close').addEventListener('click',stopPhotoCamera);
 layer.querySelector('#camera-flip').addEventListener('click',()=>{photoFacing=photoFacing==='user'?'environment':'user';startPhotoStream()});
 layer.querySelector('#camera-native').addEventListener('click',()=>{
  const requested=photoIndex;stopPhotoCamera();
  photoIndex=requested;cameraFileFallback();
 });
 layer.querySelector('#camera-shutter').addEventListener('click',()=>{
  const video=layer.querySelector('video');
  if(!video||!photoStream||video.readyState<2||photoIndex===null)return;
  try{
   const data=photoSaveCanvas(video.videoWidth,video.videoHeight,(ctx,w,h)=>{
    if(photoFacing==='user'){ctx.translate(w,0);ctx.scale(-1,1)}
    ctx.drawImage(video,0,0,w,h);
   });
   acceptPhoto(photoIndex,data);
  }catch(e){const line=layer.querySelector('#camera-state');if(line)line.textContent=e.message||'Не удалось сделать снимок.'}
 });
 startPhotoStream();
}
function handlePhotoFile(file,index){
 if(!file||stage!==6||index===null||index<0||index>2)return;
 if(!file.type.startsWith('image/')){photoStatus('Нужна фотография, а не другой файл.');return;}
 const url=URL.createObjectURL(file);
 const image=new Image();
 image.onload=()=>{
  try{
   const data=photoSaveCanvas(image.naturalWidth,image.naturalHeight,(ctx,w,h)=>ctx.drawImage(image,0,0,w,h));
   acceptPhoto(index,data);
  }catch(e){photoStatus(e.message||'Не удалось обработать снимок.')}
  finally{URL.revokeObjectURL(url)}
 };
 image.onerror=()=>{URL.revokeObjectURL(url);photoStatus('Не удалось открыть фотографию. Попробуй сделать другую.')};
 image.src=url;
}

function roundRectPhoto(ctx,x,y,w,h,r){

 ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
 ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);
 ctx.closePath();
}

 });

function drawPhotoCover(ctx,img,x,y,w,h){
 const scale=Math.max(w/img.naturalWidth,h/img.naturalHeight);
 const dw=img.naturalWidth*scale,dh=img.naturalHeight*scale;
 ctx.drawImage(img,x+(w-dw)/2,y+(h-dh)/2,dw,dh);

function printWrapped(ctx,text,x,y,maxWidth,lineHeight,maxLines){
 const words=String(text).split(/\s+/),lines=[];
 let line='';
 for(const word of words){
  const probe=line?line+' '+word:word;
  if(ctx.measureText(probe).width<=maxWidth||!line)line=probe;
  else {lines.push(line);line=word;}
 }
 if(line)lines.push(line);
 if(maxLines&&lines.length>maxLines){
  lines.length=maxLines;while(ctx.measureText(lines[maxLines-1]+'…').width>maxWidth&&lines[maxLines-1].length)lines[maxLines-1]=lines[maxLines-1].slice(0,-1);
  lines[maxLines-1]+='…';
 }
 lines.forEach((str,i)=>ctx.fillText(str,x,y+i*lineHeight));
 return Math.min(lines.length,maxLines||lines.length);
}
function printPolaroid(ctx,img,x,y,w,h,angle,label){

 ctx.fillStyle='#fffefa';ctx.fillRect(left,top,w,h);
 ctx.shadowBlur=0;ctx.shadowOffsetY=0;
 const inner={x:left+19,y:top+19,w:w-38,h:h-105};
 if(img){
  ctx.save();ctx.beginPath();ctx.rect(inner.x,inner.y,inner.w,inner.h);ctx.clip();
  drawPhotoCover(ctx,img,inner.x,inner.y,inner.w,inner.h);ctx.restore();
 }else{

  ctx.fillStyle='#a8768c';ctx.font='42px Georgia,serif';ctx.textAlign='center';
  ctx.fillText('♡',0,top+h/2);
 }

/* A real shared stop, not a remotely tracked location. Arriving and coffee
 * are confirmed by the couple, with no purchase or GPS permission required. */
const PARK_KEY='sd2810-zarechny-visit-v1';
function parkState(){
 const key={day:localStorage.getItem(DATE_KEY),origin};
 let raw=null;
 try{raw=JSON.parse(localStorage.getItem(PARK_KEY)||'null')}catch(e){}
 if(!raw||raw.day!==key.day||raw.origin!==key.origin)return {...key,arrived:false,together:false,coffee:null,coffeeDone:false};
 const coffee=['yes','no'].includes(raw.coffee)?raw.coffee:null;
 return {...key,arrived:raw.arrived===true,together:raw.together===true,
  coffee,coffeeDone:coffee!==null&&raw.coffeeDone===true};
}
function parkReady(){
 const p=parkState();
 return p.arrived&&p.together&&p.coffee!==null&&p.coffeeDone;
}
function parkAction(action){
 if(stage!==6||!canStart())return;
 const p=parkState();
 let shouldAdvance=false;
 if(action==='arrive'){p.arrived=true;shouldAdvance=true;}
 else if(action==='together'&&p.arrived){p.together=true;shouldAdvance=true;}
 else if((action==='coffee-yes'||action==='coffee-no')&&p.arrived&&p.together){
  p.coffee=action==='coffee-yes'?'yes':'no';
  p.coffeeDone=false; // Choosing is not the same as visiting/skipping the stop.
  shouldAdvance=true;
 }else if(action==='coffee-finish'&&p.coffee!==null&&!p.coffeeDone){
  p.coffeeDone=true;shouldAdvance=true;
 }else if(action==='coffee-skip'&&p.coffee==='yes'&&!p.coffeeDone){
  p.coffee='no';p.coffeeDone=true;shouldAdvance=true;
 }else return;
 // Persist before re-rendering. The story navigator reads this state to
 // decide whether the couple can move forward.
 localStorage.setItem(PARK_KEY,JSON.stringify(p));
 render();
 // Each explicit answer is a completed page. Do not make Lisa tap a second,
 // visually unrelated "Next" button and wonder whether her choice worked.
 if(shouldAdvance)window.StoryFlow?.next();
}

function spinRomanticWheel(){
 if(stage!==10||!missionReady('glitch')||prankReady('wheel'))return;
 const btnEl=document.getElementById('wheel-spin'),wheel=document.getElementById('wheel-disc');
 if(!btnEl||btnEl.disabled)return;
 btnEl.disabled=true;
 const target=Math.floor(Math.random()*4);
 const deg=1080+(360-(target*90+45));
 if(wheel)wheel.style.transform='rotate('+deg+'deg)';
 const status=document.getElementById('wheel-status');
 if(status)status.textContent='Колесо выбирает награду…';
 setTimeout(()=>{if(stage===10&&!prankReady('wheel'))completePrank('wheel',target)},2700);
}

function storyPhase(){

 if(stage===5)return 'premium-'+m.premium;

 if(stage===6)return 'park-v2-terrazza-stop';
 if(stage===10)return 'glitch-'+m.glitch+'-wheel-'+p.wheel;
 if(stage===12&&e?.kind==='quest'){const q=getQuest();return 'quest-'+q.phase+'-'+q.round;}
 if(stage===12)return 'ending-'+(localStorage.getItem(END_KEY)||'')+'-movie-'+(movieInfo()?'yes':'no');

function storyCanAdvance(index){
 if(isHost()&&!window.SDTest.active())return true;
 if(stage===1){
  if(index===0)return !!radioAnswer()||!!window.StoryFlow?.marked('radio');
  if(index===1)return !!radioAnswer();
  if(index===2)return !!window.StoryFlow?.marked('firstSong');
  if(index===3)return prankReady('driver');
  if(index===4)return prankReady('vip');
 }
 if(stage===6){
  if(index===2)return parkState().arrived;
  if(index===3)return parkState().together;
  if(index===4)return parkState().coffee!==null;
  if(index===5)return parkState().coffeeDone;
  if(index===6)return prankReady('suspect');
  if(index===7)return missionReady('photos');
  if(index===8)return parkReady()&&prankReady('suspect')&&missionReady('photos');
 }
 if(stage===9&&index===1)return prankReady('parcel');
 if(stage===13&&index===2)return !!window.StoryFlow?.marked('finalSong');
 return true;
}
function storyHasNext(){
 if(!canStart())return false;
 if([3,4,6,8,9].includes(stage))return true;

}

function desiredStop(){return stage===2?'lenta':stage===12&&finalChoice()?.kind==='gps'?(finalChoice()?.stop||null):null}
function nextStage(){return stage===2?3:stage===12?13:stage}
function unlock(){save(nextStage(),'gps')}
function haversine(lat1,lon1,lat2,lon2){const R=6371000,toRad=x=>x*Math.PI/180;const a=Math.sin(toRad(lat2-lat1)/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(toRad(lon2-lon1)/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))}
function inZone(p,name){const stop=SETTINGS.stops[name];return p.coords.accuracy<=stop.accuracy && haversine(p.coords.latitude,p.coords.longitude,stop.lat,stop.lon)<=stop.radius}
function detectOrigin(p){
 if(inZone(p,'zap'))return 'zap';
 if(inZone(p,'luga'))return 'luga';
 return null;
}
function updateStatus(message){const el=document.getElementById('geo-status');if(el)el.textContent=message||''}
function onPosition(p,expectedStage,auto){
 if(!canStart()||stage!==expectedStage)return;
 locAllowed=true;
 if(expectedStage===0){
  const mode=detectOrigin(p);
  if(mode){setOrigin(mode);return}
  geoStatus=p.coords.accuracy>SETTINGS.stops.zap.accuracy?'GPS пока недостаточно точен. Попробуй на открытом месте или используй код ведущего.':'Ты пока не в Заплюсье и не в пределах Луги. Начните игру при встрече или воспользуйтесь ручным выбором.';
  updateStatus(geoStatus);return;
 }
 const target=desiredStop();if(!target)return;
 if(inZone(p,target)){geoStatus='✓ Вы прибыли в нужное место!';updateStatus(geoStatus);unlock();return}
 geoStatus=p.coords.accuracy>SETTINGS.stops[target].accuracy?'GPS определил местоположение недостаточно точно. Попробуйте ещё раз у окна или на открытом месте.':'GPS работает. До нужной точки ещё не добрались. Следующий этап откроется после прибытия.';
 updateStatus(geoStatus);
 if(!auto)startWatch();
}
function onError(e){geoStatus=e.code===1?'Доступ к геолокации запрещён. Откройте сайт через HTTPS в Chrome и проверьте разрешения сайта и телефона. Можно воспользоваться ручным переходом.':e.code===2?'Местоположение не определилось. Проверьте, включён ли GPS, или используйте ручной переход.':'GPS не успел ответить. Попробуйте ещё раз или воспользуйтесь кодом ведущего.';updateStatus(geoStatus)}
function checkPosition(){
 if(!canStart()){render();return;}
 if(window.SDTest.active()){
  if(stage===0){
   const help=document.getElementById('help'),manual=document.getElementById('manual-start');
   if(help)help.classList.remove('hidden');
   if(manual)manual.classList.remove('hidden');
   updateStatus('🔧 Тест: выбери старт в Заплюсье или Луге. Настоящий GPS не нужен.');
   return;
  }
  if(stage===2||(stage===12&&finalChoice()?.kind==='gps')){
   updateStatus('🔧 Тест: прибытие к точке подтверждено без GPS.');
   unlock();return;
  }
 }
 if(!navigator.geolocation||!window.isSecureContext){updateStatus('Для работы GPS открой игру по защищённой HTTPS-ссылке (GitHub Pages) в обычном браузере Chrome.');return}
 const expectedStage=stage;
 updateStatus('Определяем местоположение… Браузер может запросить разрешение на GPS.');
 try{navigator.geolocation.getCurrentPosition(p=>onPosition(p,expectedStage,false),onError,{enableHighAccuracy:true,timeout:18000,maximumAge:0})}
 catch(e){updateStatus('Браузер не смог запустить GPS. Открой ссылку по HTTPS в Chrome или используй ручной переход.')}
}
function startWatch(){
 if(watchID!==null||!navigator.geolocation||!window.isSecureContext||!desiredStop())return;
 const expectedStage=stage;
 watchID=navigator.geolocation.watchPosition(p=>onPosition(p,expectedStage,true),onError,{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
}
function stopWatch(){if(watchID!==null&&navigator.geolocation)navigator.geolocation.clearWatch(watchID);watchID=null}
window.addEventListener('pagehide',()=>{stopWatch();stopPhotoCamera()});

 <p class="small">Для сохранения требуется fine-grained токен с доступом только к репозиторию secret-date и разрешением Contents: Read and write. Токен не сохраняется на сайте: вводи его при каждом изменении.</p>
 <input id="host-github-token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Временный GitHub token" aria-label="GitHub fine-grained token">
 <a class="link" href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer">Создать токен на GitHub</a>
 <button id="host-plan-save" type="button">Сохранить на всём сайте 🌐</button>
 <button id="host-plan-refresh" type="button">Проверить общие настройки</button>
 <p class="small" id="host-plan-status">Токен отправляется напрямую на api.github.com, только при сохранении. Не пересылай его Лизе или в чат.</p>`;
 const status=()=>document.getElementById('host-plan-status');
 document.getElementById('host-plan-refresh').addEventListener('click',async()=>{
  status().textContent='Проверяем…';await refreshGlobalConfig(true);
  const e=status();if(e)e.textContent=globalStatus;
 });
 document.getElementById('host-plan-save').addEventListener('click',async()=>{
  let mask=0;box.querySelectorAll('[data-plan-opt]').forEach(el=>{if(el.checked)mask|=(1<<OPT_IDS.indexOf(el.dataset.planOpt));});
  if(!mask){status().textContent='Нужно оставить хотя бы один вариант.';return;}
  const input=document.getElementById('host-github-token');
  const token=input.value.trim();
  input.value='';
  if(token.length<20){status().textContent='Введи действующий fine-grained GitHub token. Он не сохраняется.';return;}
  const button=document.getElementById('host-plan-save');
  button.disabled=true;status().textContent='Сохраняем общие настройки в GitHub…';
  try{
   const headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28'};
   const read=await fetch(GLOBAL_CONFIG_API+'?ref=main',{headers,cache:'no-store'});
   if(!read.ok)throw new Error('Не удалось открыть файл настроек (HTTP '+read.status+'). Проверь токен и права Contents.');
   const original=await read.json();
   if(typeof original.sha!=='string')throw new Error('GitHub не вернул SHA конфигурации.');
   const originalConfig=JSON.parse(atob(String(original.content||'').replace(/\s/g,'')));
   if(!isValidConfig(originalConfig))throw new Error('Файл настроек GitHub имеет неверный формат.');
   const config={version:1,revision:originalConfig.revision+1,mask,updatedAt:new Date().toISOString()};
   const result=await fetch(GLOBAL_CONFIG_API,{
    method:'PUT',
    headers:{...headers,'Content-Type':'application/json'},
    body:JSON.stringify({message:'Update shared date finale availability',content:btoa(JSON.stringify(config,null,2)+'\n'),sha:original.sha,branch:'main'})
   });
   if(!result.ok){
    const body=await result.json().catch(()=>({}));
    throw new Error('GitHub не сохранил файл (HTTP '+result.status+'). '+(body.message||''));
   }
   applyGlobalConfig(config);
   const bar=document.getElementById('host-plan-status');
   if(bar)bar.textContent='✓ Изменения сохранены в GitHub! Все устройства увидят их при следующей проверке. Новая ссылка не нужна.';
  }catch(error){
   const bar=document.getElementById('host-plan-status');if(bar)bar.textContent='Не удалось сохранить: '+(error.message||'ошибка');
  }finally{
   const btn=document.getElementById('host-plan-save');if(btn)btn.disabled=false;
  }
 });
}

 localStorage.setItem(CAT_KEY,ENDINGS[id].cat);chooseEnding(id);
});

 render();
});

window.addEventListener('storage',e=>{if(e.key===DATE_KEY)render();});
window.addEventListener('focus',()=>refreshGlobalConfig(true));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshGlobalConfig(true);});
setInterval(()=>{if(!document.hidden)refreshGlobalConfig()},25000);
render();

 window.SecretSoundtrack?.previewTrack(0);
 try{window.history.replaceState(null,'',window.location.pathname)}catch(e){}
}
refreshGlobalConfig(true);
</script>
