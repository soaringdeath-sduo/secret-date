<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#140f20">
<meta name="description" content="Личное интерактивное приглашение на свидание для Елизаветы">
<title>28.10 • Секретный маршрут</title>
<style>
:root{--bg:#110e1b;--panel:#1f182d;--text:#fff7f9;--mute:#bdb0c5;--rose:#f19abc;--pink:#f9669c;--gold:#f4c78a;--edge:rgba(255,255,255,.12);--shadow:0 24px 70px rgba(0,0,0,.38)}
*{box-sizing:border-box}html{height:100%;background:var(--bg)}body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:radial-gradient(ellipse 95% 55% at 90% 7%,#402143b0,transparent 70%),radial-gradient(ellipse 105% 65% at -20% 96%,#2a284eb0,transparent 70%),var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-1;opacity:.2;pointer-events:none;background-image:radial-gradient(#fff 0.7px,transparent 1px);background-size:30px 31px;mask-image:linear-gradient(to bottom,black,transparent)}
.shell{width:min(100%,490px);margin:0 auto;padding:24px 18px max(26px,env(safe-area-inset-bottom));min-height:100dvh;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 4px 21px}.monogram{font-size:10px;letter-spacing:2.4px;color:var(--rose);font-weight:850}.tag{border:1px solid var(--edge);border-radius:100px;padding:8px 12px;color:#dbcede;font-size:10px;letter-spacing:1px}
.card{isolation:isolate;position:relative;overflow:hidden;min-height:560px;background:linear-gradient(155deg,rgba(53,35,65,.92),rgba(22,20,35,.98) 70%);border:1px solid rgba(255,255,255,.14);border-radius:28px;box-shadow:var(--shadow);padding:30px 24px 25px;flex:1;display:flex;flex-direction:column;animation:appear .55s ease both}
.card:before{content:"";position:absolute;z-index:-1;width:310px;height:310px;right:-150px;top:-150px;filter:blur(8px);background:radial-gradient(circle,rgba(248,111,164,.17),transparent 66%);border-radius:50%}
.card:after{content:"✧";position:absolute;right:25px;top:25px;color:rgba(254,208,230,.26);font-size:35px;pointer-events:none;animation:twinkle 3.8s ease-in-out infinite}
.eyebrow{font-size:11px;font-weight:850;color:var(--rose);text-transform:uppercase;letter-spacing:2.4px;margin-bottom:15px}.hero{font-family:Georgia,'Times New Roman',serif;font-size:clamp(35px,8.9vw,51px);line-height:1.13;letter-spacing:-1.6px;margin:0 0 14px;font-weight:500}.hero em{font-style:italic;color:#ffc2d6}.desc{font-size:15px;color:#dacddd;line-height:1.74;margin:0 0 20px}.small{font-size:12px;line-height:1.55;color:var(--mute)}.spacer{flex:1;min-height:28px}.btn{appearance:none;border:0;border-radius:17px;padding:16px 15px;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;touch-action:manipulation;transition:transform .17s,box-shadow .17s,opacity .17s;min-height:55px}.btn:active{transform:scale(.975)}.btn:focus-visible,.link:focus-visible,input:focus-visible{outline:3px solid #ffd6e7;outline-offset:3px}.btn.primary{color:#30111e;background:linear-gradient(115deg,#ffd0df,#f98eb8);box-shadow:0 9px 25px #e6538b34}.btn.second{border:1px solid rgba(255,255,255,.24);background:#ffffff0a;color:white}.btn.ghost{background:none;color:var(--rose);border:1px solid rgba(249,102,156,.37)}.btn:disabled{opacity:.55;cursor:not-allowed}.button-stack{display:grid;gap:11px}.label{font-size:12px;color:var(--gold);font-weight:750;margin-bottom:11px}
.hline{height:1px;background:var(--edge);margin:20px 0}.sig{font-family:Georgia,serif;font-style:italic;color:var(--gold);font-size:20px}.seal{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 32% 25%,#ffb6cc,#7e2f59 70%);box-shadow:0 15px 35px rgba(240,65,140,.21),inset 0 0 0 6px rgba(255,255,255,.11),inset 0 0 0 10px rgba(255,255,255,.11);margin:34px auto 27px;font-size:40px;animation:float 3s ease-in-out infinite}
.route{display:flex;align-items:center;justify-content:space-between;margin:18px 0 26px;gap:3px}.dot{height:9px;width:9px;background:#6a566f;border-radius:50%;border:2px solid #6a566f}.dot.on{background:var(--rose);border-color:var(--rose);box-shadow:0 0 0 5px rgba(243,128,180,.14)}.line{flex:1;height:1px;background:#69576f}.coords{border:1px solid var(--edge);background:#ffffff08;border-radius:17px;padding:14px 15px;margin:12px 0 18px}.coords strong{font-size:14px;display:block}.coords .small{margin-top:5px}.status{min-height:26px;color:var(--gold);font-size:12px;line-height:1.55;margin:10px 0 0}.mini{background:rgba(240,174,205,.07);border:1px solid rgba(248,168,196,.2);border-radius:18px;padding:19px 17px;margin-bottom:21px}.mini h3{margin:0 0 10px;font-size:16px;font-weight:800}.mini p{font-size:13px;color:#dacbdb;line-height:1.6;margin:7px 0}.ticket{position:relative;background:linear-gradient(155deg,#f5e3d2,#f8ccd6);color:#502e3f;border-radius:17px;padding:26px 19px;box-shadow:0 12px 35px rgba(0,0,0,.18);margin:17px 0 24px;transform:rotate(-1deg)}.ticket:before,.ticket:after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#2e1d35;top:53%;transform:translateY(-50%)}.ticket:before{left:-9px}.ticket:after{right:-9px}.ticket .top{letter-spacing:2px;font-size:10px;font-weight:850;border-bottom:1px dashed #8b7585;padding-bottom:14px}.ticket h2{font-size:26px;line-height:1.16;margin:17px 0;font-family:Georgia,serif}.ticket .details{font-size:12px;line-height:1.8}.ticket .details span{font-weight:800}.ticket .stamp{text-align:right;font-weight:850;font-size:10px;letter-spacing:1px;transform:rotate(-8deg);color:#a44363;margin-top:10px}
.meter{height:7px;border-radius:20px;background:#503451;overflow:hidden;margin:20px 0}.meter>span{display:block;width:24%;height:100%;background:linear-gradient(90deg,#e585b8,#ffd4a7);border-radius:20px;animation:meter 3s ease-in-out infinite alternate}.scanner{height:108px;border:1px solid var(--edge);border-radius:16px;display:grid;place-items:center;position:relative;overflow:hidden;margin:12px 0 22px;background:radial-gradient(circle at center,#4a304b7a,transparent 70%)}.scanner:before{content:"";position:absolute;width:95px;height:95px;border:1px solid rgba(255,201,221,.46);border-radius:50%;box-shadow:0 0 0 18px rgba(255,201,221,.05),0 0 0 34px rgba(255,201,221,.045);animation:pulse 3s ease-in-out infinite}.scanner span{position:relative;font-size:28px}
.hidden{display:none!important}.alt{margin-top:19px;border-top:1px solid var(--edge);padding-top:16px}.link{font:inherit;font-size:12px;background:none;border:none;color:#b6a6c2;cursor:pointer;padding:5px 0;text-align:left;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:4px}.code-row{display:flex;gap:7px;margin-top:11px}.code-row input{flex:1;min-width:0;border-radius:12px;background:#ffffff13;color:#fff;border:1px solid var(--edge);padding:12px;font-size:14px}.code-row button{padding:10px 12px;min-height:43px;font-size:13px;border-radius:12px}.footer{text-align:center;padding:21px 5px 3px;color:#ac96aa;font-size:11px;letter-spacing:.5px}.footer button{background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:4px}.note{font-size:12px;border-left:3px solid var(--gold);padding:10px 12px;color:#dfcfe0;background:#ffffff06;border-radius:0 8px 8px 0;margin-bottom:20px}.glitch{animation:glitch .38s steps(2,end) 4}.bloom{font-size:54px;text-align:center;line-height:1.2;margin:20px 0 10px;animation:float 3s ease-in-out infinite}.heart-rain{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}.heart-rain i{position:absolute;top:-5%;left:var(--x);font-size:var(--s);opacity:.65;color:#ffc6dd;animation:fall var(--t) linear infinite;animation-delay:var(--d);font-style:normal}.over{position:relative;z-index:1}.final-date{margin:12px 0 22px;border:1px solid rgba(255,230,235,.21);padding:16px;border-radius:15px;background:rgba(255,255,255,.05);text-align:center}.final-date b{display:block;font-size:17px;font-family:Georgia,serif;font-weight:500;line-height:1.8}.final-date span{display:block;color:#ead7e3;font-size:12px}.status-dot{display:inline-block;width:8px;height:8px;border-radius:100%;background:#a9dfbb;box-shadow:0 0 10px #94e3ae80;margin-right:8px}
@keyframes appear{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}@keyframes float{50%{transform:translateY(-8px)}}@keyframes twinkle{50%{opacity:.15;transform:rotate(14deg) scale(1.25)}}@keyframes pulse{50%{transform:scale(1.09);opacity:.38}}@keyframes meter{to{width:77%}}@keyframes glitch{25%{transform:translateX(-4px);filter:hue-rotate(70deg)}60%{transform:translateX(4px)}}@keyframes fall{to{transform:translateY(110vh) rotate(220deg)}}@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}@media(max-width:360px){.card{padding:24px 18px}.hero{font-size:34px}}

.start-hint{background:linear-gradient(125deg,rgba(245,196,139,.12),rgba(242,155,194,.08));border:1px solid rgba(244,199,138,.25);border-radius:16px;padding:14px 16px;margin-bottom:20px;font-size:13px;color:#f8deeb;line-height:1.6}
.route-tag{display:inline-flex;align-items:center;gap:6px;border-radius:90px;padding:7px 11px;background:rgba(245,155,195,.11);border:1px solid rgba(245,155,195,.27);font-size:12px;color:#ffd5e6;margin:0 0 20px}
.manual-start{margin-top:13px;display:grid;gap:9px}
.manual-start .btn{min-height:48px;font-size:13px}
.gate-counter{color:#ffe3c2;font-weight:850;font-size:clamp(18px,5.2vw,24px);font-variant-numeric:tabular-nums;line-height:1.5;margin:10px 0 15px}
.btn-link{display:block;text-decoration:none!important;text-align:center}
.host-bar{margin-top:14px;background:#28203a;border:1px solid #edb98c7a;border-radius:16px;padding:15px}
.host-bar .label{line-height:1.5;margin:0 0 11px;color:#f8d0a8}
.host-buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.host-buttons button{background:#422d4f;border:1px solid #8d7098;border-radius:10px;color:#fff0f5;padding:11px 6px;font-weight:700;font-size:12px}
.host-buttons button:last-child{grid-column:1/-1;background:#382132}
</style>
</head>
<body>
<div class="shell">
<header><div class="monogram">28.10 <span style="font-size:12px">♥</span> СЕКРЕТНЫЙ МАРШРУТ</div><div class="tag">ТОЛЬКО ДЛЯ ЛИЗЫ</div></header>
<main id="app" class="card" aria-live="polite"></main>
<div class="footer"><button id="organizer" type="button" title="Дополнительные настройки">Сделано с любовью • 2114</button></div>
<div id="host-bar" class="host-bar hidden"><div class="label">🔧 Режим ведущего: дата и GPS для теста не требуются</div><div class="host-buttons"><button id="host-stage" type="button">Выбрать экран 0–11</button><button id="host-origin" type="button">Выбрать старт</button><button id="host-exit" type="button">Завершить тест</button></div></div>
</div>
<script>
'use strict';
/* Маршруты и зоны приблизительны. После разведки парковок при необходимости поправьте координаты. */
const SETTINGS={
  eventDate:'15 ноября 2026 года',eventTime:'11:30',
  helpCode:'2114-2810',
  eventStartUTC: Date.UTC(2026,10,15,8,30,0),
  stops:{
    zap:{lat:58.43701,lon:29.73847,radius:4200,accuracy:1200,label:'Заплюсье'},
    luga:{lat:58.7387405,lon:29.836289,radius:6700,accuracy:1200,label:'Луга'},
    lenta:{lat:58.732605,lon:29.843714,radius:550,accuracy:500,label:'Лента, Луга'},
    lake:{lat:58.721131,lon:29.815947,radius:900,accuracy:600,label:'Омчино'}
  }
};
const STATEKEY='sd2810-route-v4', MODEKEY='sd2810-route-origin-v4';
const INVITE_KEY='sd2810-invite-approved-v3', HOST_KEY='sd2810-host-v3';
const isHost=()=>localStorage.getItem(HOST_KEY)==='1';
const invited=()=>localStorage.getItem(INVITE_KEY)==='1';
const dateOK=()=>Date.now()>=SETTINGS.eventStartUTC;
const canStart=()=>isHost()||(invited()&&dateOK());
const formatWait=ms=>{const s=Math.max(0,Math.ceil(ms/1000)),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),sec=s%60;return `${d} д. ${String(h).padStart(2,'0')} ч. ${String(m).padStart(2,'0')} мин. ${String(sec).padStart(2,'0')} сек.`};
const app=document.getElementById('app');
let stage=Math.min(11,Math.max(0,Number(localStorage.getItem(STATEKEY)||0)||0));
let origin=localStorage.getItem(MODEKEY);
if(!['zap','luga'].includes(origin)){origin=null;if(stage>0)stage=0;}
let watchID=null,locAllowed=false,geoStatus='',helpOpen=false,adminClicks=0;
let gateTicker=null;
function gateHTML(){
 if(!invited())return `<div class="eyebrow">Персональный доступ</div><div class="seal" aria-hidden="true">💌</div><h1 class="hero">Сначала <em>приглашение</em></h1>
  <p class="desc">Чтобы отправиться в секретное путешествие, сначала открой конверт, ответь на вопросы и вспомни пароль нашей истории.</p>
  <div class="spacer"></div><a class="btn primary btn-link" href="index.html">Перейти к приглашению ♥</a>`;
 return `<div class="eyebrow">Глава 01 • В ожидании</div><div class="seal" aria-hidden="true">🔒</div><h1 class="hero">Ещё <em>немножко терпения…</em></h1>
  <p class="desc">Приглашение принято. Путешествие откроется <b>15 ноября 2026 года в 11:30 по Москве</b>.</p>
  <div class="mini"><div class="label">ДО НАЧАЛА ПРИКЛЮЧЕНИЯ</div><div class="gate-counter" id="gate-countdown" role="timer">${formatWait(SETTINGS.eventStartUTC-Date.now())}</div><p class="small">Открой страницу в день встречи. До этого секреты останутся закрыты.</p></div>
  <div class="spacer"></div><a class="btn second btn-link" href="index.html">Вернуться к приглашению</a>`;
}
function setupGateTicker(){
 if(gateTicker!==null){clearInterval(gateTicker);gateTicker=null;}
 if(canStart()||!invited())return;
 gateTicker=setInterval(()=>{
   if(canStart()){clearInterval(gateTicker);gateTicker=null;render();return;}
   const el=document.getElementById('gate-countdown');if(el)el.textContent=formatWait(SETTINGS.eventStartUTC-Date.now());
 },1000);
}
function displayHostBar(){
 const bar=document.getElementById('host-bar');
 if(!bar)return;
 bar.classList.toggle('hidden',!isHost());
}

const btn=(label,id,kind='primary')=>`<button class="btn ${kind}" id="${id}" type="button">${label}</button>`;
const foot=()=>`<div class="spacer"></div><p class="small" style="margin:14px 0 0">GPS работает только после разрешения. Координаты не отправляются Игорю и не сохраняются на сервере. Можно остановить игру в любой момент.</p>`;
const save=s=>{stage=s;localStorage.setItem(STATEKEY,String(s));helpOpen=false;geoStatus='';render();};
const setOrigin=mode=>{origin=mode;localStorage.setItem(MODEKEY,mode);save(1);};
const originName=()=>origin==='zap'?'посёлок Заплюсье':'город Луга';
const check=(label)=>`<div class="scanner"><span aria-hidden="true">📍</span></div>
<p class="small">Нажми на кнопку и разреши сайту определить местоположение. Координаты проверяются только здесь, в браузере. Разрешение можно отозвать в настройках телефона.</p>
<div class="button-stack">${btn(label,'check')}</div><div class="status" id="geo-status" role="status"></div>
<div class="alt"><button class="link" id="show-help" type="button">GPS не работает? Ручной переход с Игорем</button>
<div id="help" class="${helpOpen?'':'hidden'}"><p class="small">Если GPS ошибается, попроси Игоря ввести код ведущего.</p>
<div class="code-row"><input aria-label="Код ведущего" id="help-code" type="password" placeholder="Код ведущего" autocomplete="off" spellcheck="false"><button class="btn second" id="help-go" type="button">ОК</button></div>
<div class="status" id="help-status" role="status"></div>
${stage===0?'<div class="manual-start hidden" id="manual-start"><p class="small">Игорь, откуда начинается поездка?</p>'+btn('Начинаем в Заплюсье','start-zap','second')+btn('Начинаем в Луге','start-luga','second')+'</div>':''}
</div></div>`;
const stageHTML=()=>{
 if(!canStart()) return gateHTML();
 switch(stage){
 case 0:return `<div class="eyebrow">Закрытый маршрут • Проверка точки старта</div><div class="seal" aria-hidden="true">💌</div><h1 class="hero">Лиза, <em>начинаем?</em></h1>
<p class="desc">Сегодня для тебя подготовлена маленькая история. Сценарий сам определит, откуда начнётся путешествие: из Заплюсья или из Луги.</p>
<div class="mini"><div class="label">ВАШЕ ПРИГЛАШЕНИЕ</div><p>Участница: <b>Бекетова Елизавета Васильевна</b></p><p>Организатор: <b>Егоров Игорь Алексеевич</b></p><p>Дата: <b>${SETTINGS.eventDate}, ${SETTINGS.eventTime}</b></p><p>Место встречи: <b>Заплюсье или Луга</b></p></div>
<div class="start-hint">♥ Нажми «Определить старт», когда уже встретишься с Игорем и сядешь в машину. Раньше начинать не нужно — тогда маршрут выберется правильно.</div>
${check('📍 Определить старт и начать игру')}${foot()}`;
 case 1:return `<div class="eyebrow">Глава 01 • Старт определён</div><div class="bloom">💗</div><h1 class="hero">Ну здравствуй, <em>вредина.</em></h1>
<div class="route-tag">📍 Ваш старт: ${originName()}</div>
<p class="desc">Встреча состоялась. Можно отправляться за первыми впечатлениями. И нет, я не расскажу, что будет дальше 😉</p>
<div class="mini"><h3>${origin==='zap'?'Впереди небольшая поездка':'Начинаем прямо в Луге'}</h3><p>${origin==='zap'?'Сначала отправимся из Заплюсья в Лугу. Первая остановка ждёт в городе.':'Сегодня длинный путь не нужен. Первая остановка — уже совсем рядом.'}</p><p>Сайт подскажет, когда откроется следующая глава. Игорь следит за дорогой, а ты можешь наслаждаться музыкой.</p></div>
<div class="spacer"></div>${btn('Узнать первую остановку →','go')}`;
 case 2:return `<div class="eyebrow">Глава 02 • Первая остановка</div><h1 class="hero">Твоё первое <em>свидание.</em></h1>
<p class="desc">Красная дорожка? Нет. Лимузин? Тоже нет. Но кое-что приготовлено специально для тебя.</p>
<div class="coords"><strong>📍 г. Луга — «Супер Лента»</strong><div class="small">Проспект Урицкого, 77к3. Остановитесь на разрешённом месте парковки. Дальше сайт сам проверит прибытие — либо нажми GPS-кнопку.</div></div>
<p class="note">Если вы уже возле магазина, этот этап откроется сразу после проверки GPS. Водитель телефоном в движении не пользуется.</p>
${check('📍 Проверить прибытие к «Ленте»')}${foot()}`;
 case 3:return `<div class="eyebrow">Пакет услуг • Эконом-романтика</div><h1 class="hero">Ваше свидание <em>началось!</em></h1>
<p class="desc">Поприветствуем персональную программу, созданную для самой требовательной пассажирки.</p>
<div class="ticket"><div class="top">СВИДАНИЕ №2810 / ЭКОНОМ</div><h2>Неспешный романтический отдых</h2><div class="details">Место: <span>салон ВАЗ-2114</span><br>Угощение: <span>одна шоколадка</span><br>Развлечения: <span>поболтать и послушать музыку</span><br>Ведущий: <span>лично Игорь</span></div><div class="stamp">ВСЁ ВКЛЮЧЕНО*</div></div>
<p class="small">*Включено только перечисленное. Не спешите: посидите вместе, пообщайтесь, съешьте шоколадку.</p><div class="spacer"></div>${btn('Ну и что дальше?','go')}`;
 case 4:return `<div class="eyebrow">Заявка выполнена</div><h1 class="hero">Свидание <em>завершено.</em></h1>
<p class="desc">Спасибо за участие в романтической программе. Дополнительные мероприятия не предусмотрены.</p>
<div class="mini"><h3>Ваш чек 🧾</h3><p>Шоколадка — 1 шт.</p><p>Вместе проведённое время — бесценно.</p><p>Роскошные сюрпризы — 0 шт.</p><div class="hline"></div><p><b>Вероятный отзыв: «И это всё?!»</b></p></div>

function render(){
 stopWatch();app.innerHTML=stageHTML();app.style.animation='none';void app.offsetWidth;app.style.animation='appear .48s ease both';
 displayHostBar();setupGateTicker();
 if(!canStart())return;
 const go=document.getElementById('go');
 if(go)go.addEventListener('click',()=>save({1:2,3:4,4:5,5:6,6:7,8:9,9:10}[stage]??stage));
 const snackYes=document.getElementById('snack-yes');if(snackYes)snackYes.addEventListener('click',()=>save(8));
 const snackNo=document.getElementById('snack-no');if(snackNo)snackNo.addEventListener('click',()=>save(9));
 const skipSnack=document.getElementById('skip-snack');if(skipSnack)skipSnack.addEventListener('click',()=>save(9));
 const checkButton=document.getElementById('check');if(checkButton)checkButton.addEventListener('click',checkPosition);
 const show=document.getElementById('show-help');if(show)show.addEventListener('click',()=>{helpOpen=!helpOpen;document.getElementById('help').classList.toggle('hidden',!helpOpen)});
 const helpGo=document.getElementById('help-go');if(helpGo)helpGo.addEventListener('click',()=>{
  const val=(document.getElementById('help-code').value||'').trim().toLowerCase();
  if(val!==SETTINGS.helpCode.toLowerCase()){document.getElementById('help-status').textContent='Код не подошёл. Попроси Игоря помочь.';return}
  if(stage===0){document.getElementById('help-status').textContent='Доступ открыт. Укажи место начала поездки.';document.getElementById('manual-start').classList.remove('hidden');}
  else unlock();
 });
 const startZap=document.getElementById('start-zap');if(startZap)startZap.addEventListener('click',()=>setOrigin('zap'));
 const startLuga=document.getElementById('start-luga');if(startLuga)startLuga.addEventListener('click',()=>setOrigin('luga'));
 const quit=document.getElementById('quit');if(quit)quit.addEventListener('click',()=>{quit.textContent='Хорошо ♥ Можешь остановиться в любой момент';go.textContent='Всё-таки продолжить →'});
 const hug=document.getElementById('hug');if(hug)hug.addEventListener('click',()=>{document.getElementById('hug-text').textContent='Теперь откладывай телефон и обнимай. ❤️';hug.textContent='♥♥♥'});
 if(locAllowed && [2,10].includes(stage))startWatch();
 updateStatus(geoStatus);
}
function desiredStop(){return stage===2?'lenta':stage===10?'lake':null}
function nextStage(){return stage===2?3:stage===10?11:stage}
function unlock(){save(nextStage())}
function haversine(lat1,lon1,lat2,lon2){const R=6371000,toRad=x=>x*Math.PI/180;const a=Math.sin(toRad(lat2-lat1)/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(toRad(lon2-lon1)/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))}
function inZone(p,name){const stop=SETTINGS.stops[name];return p.coords.accuracy<=stop.accuracy && haversine(p.coords.latitude,p.coords.longitude,stop.lat,stop.lon)<=stop.radius}
function detectOrigin(p){
 if(inZone(p,'zap'))return 'zap';
 if(inZone(p,'luga'))return 'luga';
 return null;
}
function updateStatus(message){const el=document.getElementById('geo-status');if(el)el.textContent=message||''}
function onPosition(p,expectedStage,auto){
 if(!canStart()||stage!==expectedStage)return;
 locAllowed=true;
 if(expectedStage===0){
  const mode=detectOrigin(p);
  if(mode){setOrigin(mode);return}
  geoStatus=p.coords.accuracy>SETTINGS.stops.zap.accuracy?'GPS пока недостаточно точен. Попробуй на открытом месте или используй код ведущего.':'Ты пока не в Заплюсье и не в пределах Луги. Начните игру при встрече или воспользуйтесь ручным выбором.';
  updateStatus(geoStatus);return;
 }
 const target=desiredStop();if(!target)return;
 if(inZone(p,target)){geoStatus='✓ Вы прибыли в нужное место!';updateStatus(geoStatus);unlock();return}
 geoStatus=p.coords.accuracy>SETTINGS.stops[target].accuracy?'GPS определил местоположение недостаточно точно. Попробуйте ещё раз у окна или на открытом месте.':'GPS работает. До нужной точки ещё не добрались. Следующий этап откроется после прибытия.';
 updateStatus(geoStatus);
 if(!auto)startWatch();
}
function onError(e){geoStatus=e.code===1?'Доступ к геолокации запрещён. Откройте сайт через HTTPS в Chrome и проверьте разрешения сайта и телефона. Можно воспользоваться ручным переходом.':e.code===2?'Местоположение не определилось. Проверьте, включён ли GPS, или используйте ручной переход.':'GPS не успел ответить. Попробуйте ещё раз или воспользуйтесь кодом ведущего.';updateStatus(geoStatus)}
function checkPosition(){
 if(!canStart()){render();return;}
 if(!navigator.geolocation||!window.isSecureContext){updateStatus('Для работы GPS открой игру по защищённой HTTPS-ссылке (GitHub Pages) в обычном браузере Chrome.');return}
 const expectedStage=stage;
 updateStatus('Определяем местоположение… Браузер может запросить разрешение на GPS.');
 try{navigator.geolocation.getCurrentPosition(p=>onPosition(p,expectedStage,false),onError,{enableHighAccuracy:true,timeout:18000,maximumAge:0})}
 catch(e){updateStatus('Браузер не смог запустить GPS. Открой ссылку по HTTPS в Chrome или используй ручной переход.')}
}
function startWatch(){
 if(watchID!==null||!navigator.geolocation||!window.isSecureContext||!desiredStop())return;
 const expectedStage=stage;
 watchID=navigator.geolocation.watchPosition(p=>onPosition(p,expectedStage,true),onError,{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
}
function stopWatch(){if(watchID!==null&&navigator.geolocation)navigator.geolocation.clearWatch(watchID);watchID=null}
window.addEventListener('pagehide',stopWatch);
function chooseHostStage(){
 if(!isHost())return;
 const choice=prompt('Тестовый экран 0–11. 0 — старт, 7 — вопрос, 8 — Хлебник, 9 — Сакура, 11 — финал.', String(stage));
 if(choice===null||!/^(?:[0-9]|1[01])$/.test(choice.trim()))return;
 const target=Number(choice.trim());
 if(target===0){origin=null;localStorage.removeItem(MODEKEY);save(0);return;}
 if(!origin){origin='zap';localStorage.setItem(MODEKEY,origin);}
 save(target);
}
function chooseHostOrigin(){
 if(!isHost())return;
 const choice=prompt('Точка старта: 1 — Заплюсье, 2 — Луга',origin==='luga'?'2':'1');
 if(choice==='1'||choice==='2')setOrigin(choice==='1'?'zap':'luga');
}
function endHostMode(){
 localStorage.removeItem(HOST_KEY);
 render();
}
document.getElementById('host-stage').addEventListener('click',chooseHostStage);
document.getElementById('host-origin').addEventListener('click',chooseHostOrigin);
document.getElementById('host-exit').addEventListener('click',endHostMode);
document.getElementById('organizer').addEventListener('click',()=>{
 if(++adminClicks<6)return;adminClicks=0;
 const code=prompt('Режим ведущего. Введите код:');
 if((code||'').trim().toLowerCase()!==SETTINGS.helpCode.toLowerCase())return;
 localStorage.setItem(HOST_KEY,'1');
 render();
});
window.addEventListener('pagehide',()=>{if(gateTicker!==null)clearInterval(gateTicker)});
render();
</script>
