<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#160e24">
  <meta name="description" content="Персональное приглашение для Бекетовой Елизаветы Васильевны">
  <title>Секретное приглашение для Лизы 💌</title>
  <style>

    :root {
      color-scheme: dark;
      --bg: #130d20;
      --ink: #fff7f5;
      --muted: #d2bdcc;
      --rose: #ffa6b7;
      --rose2: #ec6c9c;
      --gold: #f6d8a4;
      --glass: rgba(39, 24, 52, .70);
      --stroke: rgba(255, 207, 227, .21);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh; min-height: 100dvh; overflow-x: hidden;
      display: grid; place-items: center;
      padding: max(25px, env(safe-area-inset-top)) 16px max(25px, env(safe-area-inset-bottom));
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 62% 35% at 7% 5%, rgba(148, 62, 117, .30), transparent 75%),
        radial-gradient(ellipse 60% 42% at 100% 90%, rgba(119, 65, 164, .35), transparent 75%),
        linear-gradient(150deg, #100c1c, #2b1736 54%, #150d24);
    }
    body::before {
      content: ""; position: fixed; inset: 0; opacity: .35; pointer-events: none;
      background-image: radial-gradient(#ffffffa5 .7px, transparent .7px);
      background-size: 32px 32px;
      mask-image: linear-gradient(to bottom, #000 0, transparent 75%);
    }
    .ambient { position: fixed; border-radius: 50%; filter: blur(55px); pointer-events: none; opacity: .34; animation: drift 14s ease-in-out infinite alternate; }
    .a1 { top: 8%; left: -120px; width: 240px; height: 240px; background: #d64b85; }
    .a2 { bottom: 1%; right: -130px; width: 290px; height: 290px; background: #7a54ba; animation-delay: -8s; }
    @keyframes drift { to { transform: translate(45px,-35px) scale(1.2); } }
    .petal { position: fixed; pointer-events: none; z-index: 0; color: #ef91b6; opacity: .30; animation: float 9s ease-in-out infinite alternate; }
    .petal:nth-of-type(3) { top: 11%; left: 12%; font-size: 15px; }
    .petal:nth-of-type(4) { top: 18%; right: 13%; font-size: 23px; animation-delay:-3s; }
    .petal:nth-of-type(5) { bottom: 20%; left: 7%; font-size: 26px; animation-delay:-5s; }
    .petal:nth-of-type(6) { bottom: 7%; right: 16%; font-size: 16px; animation-delay:-1s; }
    @keyframes float { to { transform: translateY(-22px) rotate(16deg); opacity: .55; } }

    main { position: relative; z-index: 1; width: min(100%, 462px); }
    .brand { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 0 0 20px; font-size: 10px; font-weight: 700; letter-spacing: .31em; text-transform: uppercase; color: rgba(255,218,230,.72); }
    .brand::before, .brand::after { content:""; height:1px; width:28px; background: rgba(255,192,218,.35); }
    .card {
      overflow: hidden; isolation: isolate; position: relative;
      background: linear-gradient(145deg, rgba(72,37,79,.82), var(--glass) 54%, rgba(31,20,49,.82));
      border: 1px solid var(--stroke); border-radius: 30px;
      box-shadow: 0 30px 110px rgba(3, 0, 14, .45), inset 0 1px 0 rgba(255,255,255,.1);
      backdrop-filter: blur(20px);
      min-height: 550px;
      padding: 38px 28px 34px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center;
    }
    .card::before { content:""; position:absolute; width:370px; height:370px; border-radius:50%; background: radial-gradient(circle, rgba(253,132,166,.20), transparent 65%); top:-250px; left:50%; transform:translateX(-50%); pointer-events:none; }
    .eyebrow { color: var(--gold); font-size: 11px; letter-spacing: .24em; font-weight: 800; text-transform: uppercase; margin: 0 0 18px; }
    .serif { font-family: Georgia, 'Times New Roman', serif; font-weight: 400; letter-spacing: -.035em; }
    h1, h2, p { margin-top: 0; }
    h1 { font-size: clamp(36px, 8vw, 48px); line-height: 1.12; margin: 0 0 18px; text-wrap: balance; }
    h2 { font-size: clamp(31px, 7vw, 40px); line-height: 1.18; margin: 0 0 18px; text-wrap: balance; }
    .lead { color: var(--muted); font-size: 15px; line-height: 1.7; max-width: 325px; margin: 0 auto 28px; }
    .accent { color: #ffd1d9; }
    .spark { display:block; font-size: 18px; letter-spacing: 14px; margin: 8px 0 18px 13px; color: var(--gold); }
    .envelope { width: 176px; height: 134px; position: relative; margin: 0 auto 34px; filter: drop-shadow(0 18px 22px rgba(0,0,0,.26)); animation: hover 4s ease-in-out infinite; }
    @keyframes hover { 50% {transform:translateY(-8px) rotate(-2deg);} }
    .envelope svg { display:block; width:100%; height:100%; }
    .seal { position:absolute; width:45px; height:45px; border-radius:50%; display:grid; place-items:center; left:50%; top:54%; transform:translate(-50%,-50%); background:linear-gradient(140deg,#c65b81,#85365d); border: 2px solid rgba(255,221,222,.42); box-shadow: 0 5px 14px #4d173b85; font-size: 20px; }
    .button {
      border: 0; cursor: pointer; touch-action: manipulation;
      font-family: inherit; font-size: 15px; font-weight: 750;
      border-radius: 999px; min-height: 56px; padding: 14px 30px;
      transition: transform .22s, box-shadow .22s, opacity .22s;
    }
    .button:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    .yes { color:#32172b; background:linear-gradient(110deg,#ffe0d3,#ffa2bd 58%,#f795c5); box-shadow:0 13px 29px rgba(234,91,154,.28), inset 0 1px 0 #fff9; min-width: 190px; }
    .yes:hover { transform: translateY(-2px); box-shadow: 0 17px 35px rgba(234,91,154,.36); }
    .yes:active { transform:scale(.97); }
    .no { background: rgba(255,255,255,.075); border:1px solid rgba(255,255,255,.14); color:#f4d4e2; position: relative; min-width: 96px; min-height: 54px; padding: 13px 22px; white-space:nowrap; }
    .actions { display:flex; align-items:center; justify-content:center; gap:12px; width:100%; min-height:120px; position:relative; overflow:visible; }
    .actions .no { transition: transform .18s ease, opacity .18s; }
    .hint { min-height: 22px; margin: 0 0 4px; font-size: 12px; color:#d1a9c0; }
    .progress { display:flex; justify-content:center; gap:7px; margin: 30px 0 0; }
    .dot { width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.22); transition:all .3s; }
    .dot.active { width:24px; border-radius:8px; background:linear-gradient(90deg,#ffe0cc,#ff88ad); }
    .step { width:100%; animation: enter .45s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes enter {from{opacity:0; transform:translateY(16px) scale(.98)} to{opacity:1;transform:translateY(0) scale(1)} }
    .q-number { display:inline-flex; align-items:center; justify-content:center; width:54px; height:54px; margin: 0 0 22px; border:1px solid rgba(255,195,215,.35); border-radius:17px; font-family:Georgia,serif; font-size:24px; color:var(--rose); background:rgba(231,112,156,.10); }
    .back { position:absolute; top:23px; left:22px; padding:9px; color:#e9bacb; background:transparent; border:0; font-size:12px; cursor:pointer; text-decoration:underline; text-underline-offset:4px; }
    .final-heart { font-size:62px; color:var(--rose); margin-bottom:20px; animation:beat 1.65s infinite; filter:drop-shadow(0 5px 16px rgba(251,130,167,.3)); }
    @keyframes beat {0%,100% { transform:scale(1); } 20%{transform:scale(1.11)} 36%{transform:scale(.98)} 50%{transform:scale(1.08)} }
    .details { width:100%; margin-top:28px; padding:8px 20px; border:1px solid rgba(255,214,227,.16); background:rgba(17,11,29,.31); border-radius:22px; }
    .detail { display:grid; grid-template-columns:60px 1fr; align-items:center; gap:10px; text-align:left; padding:16px 0; }
    .detail + .detail { border-top:1px solid rgba(255,255,255,.12); }
    .detail .ico { width:45px; height:45px; background:rgba(255,161,183,.10); border-radius:14px; display:grid; place-items:center; font-size:22px; }
    .detail .label { color:#e2bbcd; text-transform:uppercase; letter-spacing:.16em; font-size:10px; font-weight:800; display:block; margin-bottom:5px; }
    .detail strong { display:block; font-size:20px; font-weight:650; line-height:1.3; letter-spacing:-.02em; }
    footer { margin-top:18px; text-align:center; font-size:11px; line-height:1.5; color:rgba(255,218,228,.47); letter-spacing:.07em; }
    .confetti { position:fixed; z-index:5; pointer-events:none; animation:fall linear forwards; }
    @keyframes fall { 0%{opacity:0; transform:translateY(-30px) rotate(0deg)} 15%{opacity:1} 100%{opacity:0; transform:translateY(105vh) rotate(480deg)} }
    @media (max-width:410px) { .card{padding:32px 20px 27px;min-height:540px;border-radius:26px;} .actions{gap:9px;} .yes{min-width:166px;} .no{min-width:79px;padding-inline:15px;} .details{padding-inline:14px;} }
    @media (max-height:670px) { body{padding-top:14px;padding-bottom:14px;} .brand{margin-bottom:10px;} .card{min-height:490px;padding-top:27px;padding-bottom:24px;} .envelope{margin-bottom:20px;width:147px;height:112px;} .lead{margin-bottom:16px;} .actions{min-height:94px;} .progress{margin-top:16px;} }
    @media (prefers-reduced-motion:reduce) { *, *::before, *::after {animation-duration:.01ms!important;transition-duration:.01ms!important;} }
  
    /* Дополнительные стили для персонального приглашения */
    .card { min-height: 575px; }
    .brand { letter-spacing: .22em; }
    .q-number { animation: glyphPulse 2.5s ease-in-out infinite; }
    @keyframes glyphPulse { 50% { box-shadow: 0 0 0 8px rgba(255,149,185,.05); transform: rotate(-3deg); } }
    .heartline { font-size: 20px; color: #ffd6e2; letter-spacing: 7px; margin: 7px 0 16px; animation: heartbeat 3s ease-in-out infinite; }
    @keyframes heartbeat { 50% { opacity:.55; transform: scale(1.04); } }
    .question-ordinal { font-size: 12px; color: #efc4d5; letter-spacing: .06em; margin: 0 0 13px; }
    .form-label { display:block; color:#f4ccda; font-size:13px; margin-bottom:13px; }
    .secret-input { display:block; width:100%; max-width:310px; margin: 0 auto; min-height:64px; border-radius:19px; background: rgba(18,11,34,.55); border:1px solid rgba(255,188,219,.36); color:#fff8fa; font: 700 26px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; text-align:center; letter-spacing: .18em; outline: none; transition:box-shadow .25s,border-color .25s; }
    .secret-input:focus { border-color:#ffbad0; box-shadow:0 0 0 4px rgba(255,154,191,.13); }
    .secret-input::placeholder { color:rgba(255,219,228,.30); }
    .secret-input.error { border-color:#ff8398; animation:shake .34s linear; }
    @keyframes shake { 0%,100% {transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)} }
    .submit-secret { width:100%; max-width:310px; margin-top:16px; }
    .secret-msg { display:block; font-size:12px; line-height:1.5; min-height:39px; margin:11px auto 0; color:#f9becb; max-width:320px; }
    .stamp { display:inline-flex; align-items:center; justify-content:center; margin-bottom:15px; color:#ffd4dc; background:rgba(255,181,210,.08); padding:8px 14px; border:1px solid rgba(255,181,210,.22); border-radius:100px; font-size:11px; text-transform:uppercase; font-weight:800; letter-spacing:.13em; }
    .invitation-title { font-size:clamp(33px,8vw,45px); margin:0 0 8px; }
    .date-wide { font-size:23px; }
    .final-heart { animation: beat 1.65s infinite, glow 3s ease-in-out infinite; }
    @keyframes glow {50% {filter:drop-shadow(0 0 23px rgba(255,151,181,.8));}}
    .details {margin-top:24px}
    .reveal {animation: appearUp .8s cubic-bezier(.2,.8,.2,1) both;}
    @keyframes appearUp {from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
    .seal {animation: sealshine 2.8s ease-in-out infinite;}
    @keyframes sealshine {50% {box-shadow:0 5px 24px rgba(255,160,194,.55);}}
    .progress .dot.done {background:#e5b6c9;opacity:.55}
    @media (max-width:410px) {.card {min-height:550px} .question-ordinal {font-size:11px} .stamp {letter-spacing:.08em} }
    @media (prefers-reduced-motion:reduce) { .q-number,.heartline,.seal,.final-heart {animation:none!important;} }

    .unlock{width:100%;margin-top:14px;padding:19px 15px 10px;border:1px solid rgba(255,194,220,.2);background:rgba(21,11,35,.3);border-radius:18px}
    .unlock-title{font-weight:800;font-size:16px;color:#ffe5f0;margin:0 0 8px}
    .unlock-description{font-size:13px;color:#d9bfcc;line-height:1.6;margin:7px 0 14px}
    .countdown{font-size:clamp(16px,4.8vw,23px);font-weight:850;line-height:1.5;letter-spacing:.01em;color:#ffe0bf;font-variant-numeric:tabular-nums;margin:18px 0}
    .launch-btn{display:block!important;width:100%;text-align:center;text-decoration:none!important;margin:15px auto 4px;padding:17px 9px!important;border-radius:15px!important;font-size:14px!important}
    .host-label{font-size:11px;color:#efc79d;margin:10px 0 0}
    .host-entry{border:0;background:transparent;color:inherit;font:inherit;letter-spacing:inherit;cursor:pointer;padding:7px}
    .date-options{display:grid;gap:12px;width:100%;margin:22px 0}
    .date-option{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:78px;padding:15px 18px;text-align:left;color:#fff3f7;background:rgba(255,165,199,.08);border:1px solid rgba(255,200,222,.32);border-radius:17px;cursor:pointer;transition:transform .2s,background .2s}
    .date-option:hover,.date-option:focus-visible{transform:translateY(-2px);background:rgba(255,169,199,.2);border-color:#ffd0e3}
    .date-option strong{font-size:17px;display:block}.date-option small{font-size:12px;color:#d9bed0;display:block;margin-top:3px}
    .date-confirm{margin-top:14px;width:100%;padding:14px;border:1px solid rgba(255,194,220,.2);background:rgba(255,194,220,.08);border-radius:17px}
    .date-confirm p{font-size:13px;line-height:1.6;color:#ffe1ed;margin:7px 0}.date-confirm .button{display:block;width:100%;margin:12px auto;padding:16px 9px;font-size:14px;text-align:center;text-decoration:none}
    .date-confirm small{font-size:11px;color:#d1b5c8}.change-date{background:none;border:0;color:#ffcade;text-decoration:underline;padding:11px 5px;cursor:pointer;font:inherit;font-size:12px}
  </style>
</head>
<body>
  <div class="ambient a1" aria-hidden="true"></div><div class="ambient a2" aria-hidden="true"></div>
  <span class="petal" aria-hidden="true">✦</span><span class="petal" aria-hidden="true">♡</span>
  <span class="petal" aria-hidden="true">♥</span><span class="petal" aria-hidden="true">✧</span>
  <main>
    <div class="brand">совершенно секретно · только для неё</div>
    <section class="card" id="card" aria-live="polite"></section>
    <footer><button id="host-entry" type="button" class="host-entry" aria-label="Подпись открытки">СДЕЛАНО ИГОРЕМ · С ЛЮБОВЬЮ И КАПЕЛЬКОЙ ХИТРОСТИ ♡</button></footer>
  </main>
  <script>
    "use strict";
    // Чтобы поменять дату и время, достаточно изменить константы ниже.
    const TIME = '11:30';
    const CITY = 'г. Луга';
    const SECRET = '2810';
    const DATE_KEY = 'sd2810-selected-day-v1';
    const DATES = {
      sat:{date:'14 ноября 2026 года',short:'14 ноября',week:'субботу',startUTC:Date.UTC(2026,10,14,8,30,0)},
      sun:{date:'15 ноября 2026 года',short:'15 ноября',week:'воскресенье',startUTC:Date.UTC(2026,10,15,8,30,0)}
    };
    const getDay = () => DATES[localStorage.getItem(DATE_KEY)] || null;
    const INVITE_KEY = 'sd2810-invite-approved-v3';
    const HOST_KEY = 'sd2810-host-v3';
    const HOST_CODE = '2114-2810'; // только для тестирования — виден в HTML
    const isHost = () => localStorage.getItem(HOST_KEY) === '1';
    const isOpen = () => isHost() || (!!getDay() && Date.now() >= getDay().startUTC);
    const formatWait = ms => {
      const total = Math.max(0, Math.ceil(ms / 1000));
      const days = Math.floor(total / 86400);
      const hours = Math.floor(total % 86400 / 3600);
      const minutes = Math.floor(total % 3600 / 60);
      const seconds = total % 60;
      return `${days} д. ${String(hours).padStart(2,'0')} ч. ${String(minutes).padStart(2,'0')} мин. ${String(seconds).padStart(2,'0')} сек.`;
    };

    const questions = [
      { title:'Вы — <span class="accent">Бекетова Елизавета Васильевна</span>?', subtitle:'Просим подтвердить личность. Приглашение предназначено только одной особенной девушке. 💌' },
      { title:'Егорова <span class="accent">Игоря Алексеевича</span> знаете?', subtitle:'По нашим данным, этот подозрительный тип очень сильно вас любит. 🤭' },
      { title:'Он случайно не ваш <span class="accent">любимый человек</span>?', subtitle:'Отрицание не предусмотрено романтическим регламентом. ❤️' },
      { title:'А в роли <span class="accent">будущего мужа</span> вы его представляете? 💍', subtitle:'Вопрос чисто шуточный… но ваше «да» определённо его обрадует. 😉' },
      { title:'Готовы доверить ему <span class="accent">одну маленькую тайну</span>?', subtitle:'Маршрут засекречен. Скука отменяется, объятия гарантируются. ✨' }
    ];
    const card = document.getElementById('card');
    const replayFromLink = new URLSearchParams(window.location.search).get('replay') === '1';
    let stage = replayFromLink ? -1 : (localStorage.getItem(INVITE_KEY) === '1' ? questions.length + (getDay()?2:1) : -1);
    let noCount=0;
    let incorrect=0;
    let ticker=null;
    function renderLaunch(){
      const box=document.getElementById('unlock-box');
      const chosen=getDay();
      if(!box||!chosen)return;
      if(isOpen()){
        box.innerHTML=`<p class="unlock-title">✨ Время приключения пришло!</p>
          <p class="unlock-description">Открой следующую главу, когда встретишься с Игорем.</p>
          <a href="secret_date_game_luga.html" class="button yes launch-btn">Начать секретный маршрут 💗</a>${isHost()?'<p class="host-label">🔧 Режим проверки: дата не ограничивает запуск</p>':''}`;
      }else{
        box.innerHTML=`<p class="unlock-title">🔒 Секретный маршрут пока закрыт</p>
          <p class="unlock-description">Твоё приглашение действительно. Игра начнётся ${chosen.short} в ${TIME} по Москве.</p>
          <div class="countdown" role="timer">${formatWait(chosen.startUTC-Date.now())}</div>
          <p class="unlock-description">До встречи! Не забудь открыть эту страницу в день свидания. ♡</p>`;
      }
    }
    function enableTicker(){
      if(ticker!==null){clearInterval(ticker);ticker=null;}
      if(stage>questions.length+1){renderLaunch();ticker=setInterval(renderLaunch,1000);}
    }
    function hostTools(){
      const raw=prompt('Режим ведущего: введите код');
      if((raw||'').trim()!==HOST_CODE)return;
      localStorage.setItem(HOST_KEY,'1');
      const option=prompt('Проверка: 1 — вопросы, 2 — дата/таймер, 3 — игра, 4 — выйти, 5 — выбор даты','2');
      if(option==='4'){localStorage.removeItem(HOST_KEY);render();return;}
      if(option==='1'){stage=-1;localStorage.removeItem(INVITE_KEY);render();return;}
      if(option==='3'){localStorage.setItem(INVITE_KEY,'1');window.location.href='secret_date_game_luga.html';return;}
      if(option==='2'||option==='5'){localStorage.setItem(INVITE_KEY,'1');stage=option==='5'?questions.length+1:(getDay()?questions.length+2:questions.length+1);render();return;}
      render();
    }

    function progress(active) {
      return `<div class="progress" aria-label="Этап ${active + 1} из ${questions.length + 1}">${Array.from({length:questions.length+1},(_,i)=>`<span class="dot ${i===active?'active':i<active?'done':''}"></span>`).join('')}</div>`;
    }
    function render() {
      noCount=0;
      if(ticker!==null){clearInterval(ticker);ticker=null;}
      if(stage===-1) {
        card.innerHTML = `<div class="step">
          <div class="envelope" aria-hidden="true"><svg viewBox="0 0 180 135" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="e" x2="1" y2="1"><stop stop-color="#fbc1cd"/><stop offset="1" stop-color="#cd648f"/></linearGradient></defs><rect x="8" y="12" width="164" height="113" rx="12" fill="#b76b94"/><path d="M8 26 Q8 12 23 12 H157 Q172 12 172 26 L94 86 Q90 90 86 86Z" fill="#f6bbc9"/><path d="M8 115 L75 66 90 78 105 66 172 115 Q172 125 158 125 H22 Q8 125 8 115Z" fill="url(#e)"/></svg><span class="seal">♥</span></div>
          <p class="eyebrow">персональное уведомление № 2810</p>
          <h1 class="serif">Для самой<br><span class="accent">любимой вредины</span></h1>
          <p class="lead">Чтобы получить приглашение, необходимо пройти очень серьёзную (нет) проверку личности. Готовы? 😏</p>
          <button class="button yes" type="button" id="start">Открыть конверт 💌</button>
          <span class="spark" aria-hidden="true">✧ ✦ ✧</span>
        </div>`;
        document.getElementById('start').addEventListener('click',()=>{stage=0;render();});
        return;
      }
      if(stage<questions.length) {
        const q=questions[stage];
        card.innerHTML = `<button class="back" type="button" id="back">← Назад</button>
          <div class="step">
            <div class="q-number">0${stage+1}</div>
            <p class="eyebrow">отдел романтических проверок</p>
            <p class="question-ordinal">Вопрос ${stage+1} из ${questions.length}</p>
            <h2 class="serif">${q.title}</h2>
            <p class="lead">${q.subtitle}</p>
            <p class="hint" id="hint" aria-live="polite">Выбирайте сердцем ♡</p>
            <div class="actions"><button class="button yes" type="button" id="yes">Да, конечно! ♥</button><button class="button no" type="button" id="no">Нет 🙃</button></div>
            ${progress(stage)}
          </div>`;
        document.getElementById('back').addEventListener('click',()=>{stage--;render();});
        document.getElementById('yes').addEventListener('click',()=>{stage++;render();});
        const no=document.getElementById('no');
        const hint=document.getElementById('hint');
        const phrases=['Ой, кнопка «Нет» убежала 🤭','Кажется, судьба голосует за «Да» 💗','Ответ «Нет» временно недоступен 😂','Попробуйте ещё… хотя лучше «Да» 😉','Романтический отдел отклоняет возражения 💌'];
        function dodge(e) {
          if(e && e.cancelable) e.preventDefault();
          noCount++;
          hint.textContent=phrases[Math.min(noCount-1,phrases.length-1)];
          const offsets=[[-24,-25],[18,-13],[-16,22],[11,19],[-6,-20],[20,8]];
          const [x,y]=offsets[noCount%offsets.length];
          no.style.transform=`translate(${x}px,${y}px) rotate(${noCount%2?'-7':'6'}deg)`;
        }
        no.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')dodge(e);});
        no.addEventListener('pointerdown',dodge);
        no.addEventListener('click',dodge);
        no.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){dodge(e);}});
        return;
      }
      if(stage===questions.length) {
        card.innerHTML=`<button class="back" type="button" id="back">← Назад</button>
          <div class="step">
            <div class="q-number">🔐</div>
            <p class="eyebrow">последняя проверка</p>
            <h2 class="serif">Остался <span class="accent">секретный пароль</span></h2>
            <p class="lead">Когда началась наша история? Введите дату, когда мы начали встречаться. Без года — только день и месяц. ❤️</p>
            <form id="secret-form" autocomplete="off">
              <label for="secret" class="form-label">Формат: ДД.ММ</label>
              <input class="secret-input" id="secret" type="text" inputmode="decimal" maxlength="10" placeholder="ДД.ММ" autocapitalize="off" spellcheck="false" aria-describedby="secret-msg" required>
              <button class="button yes submit-secret" type="submit">Получить приглашение ✨</button>
              <span class="secret-msg" id="secret-msg" role="status">Подсказка: эта дата важнее всех паролей на свете ♡</span>
            </form>
            ${progress(stage)}
          </div>`;
        document.getElementById('back').addEventListener('click',()=>{stage--;render();});
        const input=document.getElementById('secret');
        const msg=document.getElementById('secret-msg');
        document.getElementById('secret-form').addEventListener('submit',e=>{
          e.preventDefault();
          if(input.value.replace(/\D/g,'')===SECRET) {localStorage.setItem(INVITE_KEY,'1');stage++;render();celebrate();return;}
          incorrect++;
          msg.textContent=incorrect>=3?'Не сдавайся! Вспомни наш особенный день в октябре ❤️':'Хмм, этот день нам не подходит. Попробуй ещё раз 💗';
          input.classList.remove('error');void input.offsetWidth;input.classList.add('error');input.focus();input.select();
        });
        return;
      }
      if(stage===questions.length+1 || !getDay()){
        card.innerHTML=`<div class="step reveal">
          <div class="q-number">📅</div>
          <p class="eyebrow">последняя деталь</p>
          <h1 class="serif">Лиза, когда тебе <span class="accent">удобнее?</span></h1>
          <p class="lead">Выбери день нашего свидания. Начало одинаковое — в <b>11:30</b>. Здесь нет неправильного ответа. 💗</p>
          <div class="date-options">
            <button class="date-option" id="choose-sat" type="button"><span><strong>Суббота, 14 ноября</strong><small>Начало в 11:30</small></span><span>🌷</span></button>
            <button class="date-option" id="choose-sun" type="button"><span><strong>Воскресенье, 15 ноября</strong><small>Начало в 11:30</small></span><span>💌</span></button>
          </div>
          <p class="hint">После выбора появится твоё приглашение.</p>
        </div>`;
        const choose=key=>{
          const previous=localStorage.getItem(DATE_KEY);
          localStorage.setItem(DATE_KEY,key);
          if(previous!==key){localStorage.removeItem('sd2810-route-v4');localStorage.removeItem('sd2810-route-origin-v4');}
          stage=questions.length+2;render();celebrate();
        };
        document.getElementById('choose-sat').addEventListener('click',()=>choose('sat'));
        document.getElementById('choose-sun').addEventListener('click',()=>choose('sun'));
        return;
      }
      const chosen=getDay();
      const shareText=`Игорь, я выбрала ${chosen.week}, ${chosen.short} 2026 года, в 11:30 ❤️ Жду нашего свидания!`;
      const shareLink='https://t.me/share/url?url='+encodeURIComponent('https://soaringdeath-sduo.github.io/secret-date/')+'&text='+encodeURIComponent(shareText);
      card.innerHTML=`<div class="step reveal" id="final">
        <div class="final-heart" aria-hidden="true">♥</div>
        <p class="stamp">✓ личность подтверждена · пароль верный</p>
        <p class="eyebrow">секретное послание раскрыто</p>
        <h1 class="serif invitation-title">Вы приглашены <span class="accent">на свидание!</span> ♡</h1>
        <p class="lead" style="margin-bottom:8px">Бекетова Елизавета Васильевна, ваше персональное приглашение:</p>
        <div class="details">
          <div class="detail"><div class="ico">🗓️</div><div><span class="label">дата</span><strong>${chosen.date}</strong></div></div>
          <div class="detail"><div class="ico">🕙</div><div><span class="label">начало</span><strong>${TIME}</strong></div></div>
          <div class="detail"><div class="ico">📍</div><div><span class="label">город</span><strong>${CITY}</strong></div></div>
        </div>
        <div class="heartline" aria-hidden="true">♡ ♥ ♡</div>
        <div class="date-confirm">
          <p><b>💌 Сообщи Игорю выбранный день</b></p>
          <p>Нажми кнопку, выбери чат Игоря в Telegram и отправь готовое сообщение. Тогда он точно будет знать, когда тебя ждать.</p>
          <a class="button yes" href="${shareLink}" target="_blank" rel="noopener noreferrer">Отправить Игорю в Telegram ✉️</a>
          <small>В Telegram останется выбрать чат и нажать «Отправить». Сам сайт сообщение не отправляет.</small>
          <button class="change-date" id="change-date" type="button">Изменить выбранный день</button>
          <button class="change-date" id="replay-questions" type="button">💌 Пройти открытку с вопросами заново</button>
        </div>
        <div class="unlock" id="unlock-box" aria-live="polite"></div>
      </div>`;
      document.getElementById('change-date').addEventListener('click',()=>{stage=questions.length+1;render();});
      document.getElementById('replay-questions').addEventListener('click',()=>{stage=-1;render();});
      enableTicker();
    }
    function celebrate() {
      if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const icons=['♥','♡','✦','✧','💗'];
      for(let i=0;i<48;i++) {
        const el=document.createElement('span');
        el.className='confetti';el.textContent=icons[i%icons.length];
        el.style.left=`${Math.random()*100}vw`;
        el.style.top='-25px';
        el.style.color=['#f8b0c7','#ffdde0','#f9d5a4','#dfb6ff'][i%4];
        el.style.fontSize=`${12+Math.random()*16}px`;
        el.style.animationDuration=`${3+Math.random()*2.5}s`;
        el.style.animationDelay=`${Math.random()*1.3}s`;
        document.body.appendChild(el);
        el.addEventListener('animationend',()=>el.remove(),{once:true});
      }
    }
    let secretClicks=0;
    document.getElementById('host-entry').addEventListener('click',()=>{
      if(++secretClicks>=6){secretClicks=0;hostTools();}
    });
    window.addEventListener('pagehide',()=>{if(ticker!==null)clearInterval(ticker);});
    render();
  </script>
</body>
</html>
