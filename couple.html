<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7e7e4">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="description" content="Личная парная игра о любви, настроении и том, что делает нас ближе.">
<title>28.10 • Наши совпадения</title>
<link rel="stylesheet" href="polaroid-theme.css?v=3">
<link rel="stylesheet" href="host-full-test.css?v=2">
<style>
*{box-sizing:border-box}
:root{--rose:#9f4c70;--ink:#713b55;--muted:#996d80;--paper:#fffaf5;--edge:#e6c2ce}
html{min-height:100%;background:#f7eae5}
body{margin:0;min-height:100dvh;background:radial-gradient(circle at 0 0,#f8d5e3 0,transparent 50%),#f8eee8;color:var(--ink);font:15px/1.55 system-ui,-apple-system,'Segoe UI',Arial,sans-serif}
.shell{width:min(100% - 26px,560px);margin:0 auto;padding:23px 0 50px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:17px}
.brand{color:#a95a7b;letter-spacing:2px;font-size:11px;font-weight:800}
.top a{font-size:12px;text-decoration:none;color:var(--ink);font-weight:800}
.paper{position:relative;background:linear-gradient(160deg,#fffdfa,#fff3ef);border:1px solid #e3c2cc;border-radius:19px;box-shadow:0 15px 38px #995d7626;padding:24px 20px;overflow:hidden}
.paper:before{content:"";position:absolute;right:-17px;top:8px;width:80px;height:24px;transform:rotate(27deg);background:#ecc6ce8a;pointer-events:none}
.kicker{font-size:11px;font-weight:900;letter-spacing:2px;color:#b36586}
h1{font:normal clamp(33px,8vw,48px)/1.16 Georgia,serif;margin:13px 0;color:#72384f}
h2{font:normal 28px/1.17 Georgia,serif;margin:12px 0;color:#773e56}
h3{font:800 17px/1.4 system-ui,sans-serif;color:#833c5b;margin:10px 0}
p{color:#876379;line-height:1.6}
.btn,.answer{appearance:none;display:block;width:100%;min-height:50px;padding:13px 16px;border-radius:13px;font:750 14px/1.45 system-ui,sans-serif;text-align:center;cursor:pointer;touch-action:manipulation}
.btn{background:linear-gradient(120deg,#ae5c7e,#8a3c61);border:0;color:white;box-shadow:0 7px 15px #b2708e35;margin:10px 0}
.btn.alt{background:#fffaf5;border:1px solid #dbb3bf;color:#894963;box-shadow:none}
.answer{border:1px solid #dcbdc6;background:#fffaf8;color:#80445e;text-align:left;margin:9px 0}
.answer:hover,.answer:focus-visible{background:#f6e1e7;border-color:#b57593}
.btn:disabled,.answer:disabled{opacity:.62;cursor:default}
.btn:focus-visible,.answer:focus-visible,textarea:focus-visible{outline:3px solid #d691a9;outline-offset:2px}
.frame{width:min(100%,280px);margin:19px auto;padding:13px 13px 34px;background:#fffefa;border:1px solid #f6e7e1;transform:rotate(-2deg);box-shadow:0 9px 23px #99667c45;text-align:center}
.frame-art{display:grid;place-items:center;height:155px;background:linear-gradient(145deg,#e1b4c4,#b389a5);font-size:69px;color:white}
.frame-caption{font:italic 18px Georgia,serif;color:#955672;margin:12px 0 0}
.progress{height:9px;border-radius:99px;overflow:hidden;background:#edd2db;margin:12px 0}
.progress>span{display:block;height:100%;background:linear-gradient(90deg,#a64e75,#e0a8c0);transition:width .24s}
.meta{display:flex;justify-content:space-between;color:#9a6381;font-size:12px;font-weight:800;gap:10px}
.question{font:normal 23px/1.35 Georgia,serif;color:#7b3f5a;margin:20px 0}
.form{padding:13px;border-radius:12px;background:#fceef1;border:1px dashed #c88ca4;margin:15px 0}
.form textarea{display:block;background:white;color:#663449;font:15px/1.5 system-ui,sans-serif;resize:vertical;width:100%;border:1px solid #d6adbb;border-radius:10px;min-height:85px;padding:12px}
.notice{background:#f8e5e9;border-left:4px solid #bd7395;border-radius:0 10px 10px 0;padding:13px 15px;font-size:13px;color:#8b5068;margin:18px 0}
.tiny{font-size:12px;color:#946f82;line-height:1.5}
.subcard{border:1px solid #e0c0ca;background:#fffaf9;padding:16px;border-radius:14px;margin:14px 0}
.subcard b{display:block;font-size:15px}
.result-num{text-align:center;font:normal 64px/1.1 Georgia,serif;color:#a24d70;margin:13px 0}
.result-legend{text-align:center;font-size:13px;color:#8b5970}
.chapter-result{padding:15px 13px;border:1px solid #e5c3cf;border-radius:14px;margin:13px 0;background:#fff9f6}
.chapter-result summary{cursor:pointer;font-weight:800;color:#83465e}
.chapter-result summary small{display:block;font-size:12px;color:#a16a82;font-weight:600;margin-top:4px}
.compare-row{padding:12px 0;border-top:1px solid #ecd7dd}
.compare-row:first-of-type{margin-top:14px}
.compare-row .q{font-weight:750;color:#80435b;font-size:13px;margin:0 0 7px}
.compare-row .who{font-size:12px;color:#835d70;margin:3px 0}
.match{font-size:11px;color:#8a4b66;font-weight:850;margin-top:5px}
.match.same{color:#67835f}
.link-preview{overflow-wrap:anywhere;color:#8a5671;font-size:11px}
.actions{display:grid;gap:9px;margin:12px 0}
[hidden]{display:none!important}
@media(max-width:370px){.paper{padding:21px 14px}.question{font-size:21px}}
@media(prefers-reduced-motion:reduce){.progress>span{transition:none}}
</style>
</head>

 </main>

</div>

</body>
</html>
